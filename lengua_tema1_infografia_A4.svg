<svg baseProfile="full" height="1697px" version="1.1" viewBox="0 0 1200 1697" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1697" width="1200" x="0" y="0" /><rect fill="#d53e91" height="280" width="1200" x="0" y="0" /><circle cx="30" cy="15" fill="#ffd067" opacity="0.45" r="6" /><circle cx="113" cy="56" fill="#ffd067" opacity="0.45" r="9" /><circle cx="196" cy="97" fill="#ffd067" opacity="0.45" r="12" /><circle cx="279" cy="138" fill="#ffd067" opacity="0.45" r="15" /><circle cx="362" cy="179" fill="#ffd067" opacity="0.45" r="6" /><circle cx="445" cy="220" fill="#ffd067" opacity="0.45" r="9" /><circle cx="528" cy="261" fill="#ffd067" opacity="0.45" r="12" /><circle cx="611" cy="37" fill="#ffd067" opacity="0.45" r="15" /><circle cx="694" cy="78" fill="#ffd067" opacity="0.45" r="6" /><circle cx="777" cy="119" fill="#ffd067" opacity="0.45" r="9" /><circle cx="860" cy="160" fill="#ffd067" opacity="0.45" r="12" /><circle cx="943" cy="201" fill="#ffd067" opacity="0.45" r="15" /><circle cx="1026" cy="242" fill="#ffd067" opacity="0.45" r="6" /><circle cx="1109" cy="18" fill="#ffd067" opacity="0.45" r="9" /><circle cx="1192" cy="59" fill="#ffd067" opacity="0.45" r="12" /><circle cx="75" cy="100" fill="#ffd067" opacity="0.45" r="15" /><circle cx="158" cy="141" fill="#ffd067" opacity="0.45" r="6" /><circle cx="241" cy="182" fill="#ffd067" opacity="0.45" r="9" /><rect fill="#ffffff" height="208" opacity="0.13" rx="30" width="770" x="42" y="34" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="bold" x="65" y="112">LENGUA CASTELLANA</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" x="68" y="165">TEMA 1 · LENGUA, COMUNICACIÓN Y LITERATURA</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" x="68" y="212">INFOGRAFÍA ILUSTRADA · 4.º ESO · TEMA 1</text><g transform="translate(972,54)"><ellipse cx="70" cy="140" fill="#1675d2" rx="75" ry="47" /><path d="M16 120 Q-2 48 29 11 Q73 -23 113 13 Q151 49 125 126 L110 143 L33 143 Z" fill="#643b29" stroke="#3c2421" stroke-width="3" /><ellipse cx="72" cy="70" fill="#ffd0a6" rx="49" ry="60" stroke="#9d6249" stroke-width="2" /><path d="M23 49 Q32 -10 75 9 Q109 4 121 53 Q87 30 65 27 Q40 42 23 49" fill="#613421" /><circle cx="52" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="52" cy="75" fill="#142b48" r="4" /><circle cx="93" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="93" cy="75" fill="#142b48" r="4" /><line stroke="#15264e" stroke-linecap="round" stroke-width="4" x1="71" x2="74" y1="74" y2="74" /><path d="M58 104 Q74 119 91 102" fill="none" stroke="#ad4e5b" stroke-linecap="round" stroke-width="4" /><path d="M20 148 Q73 118 123 150" fill="none" stroke="#09539b" stroke-width="5" /></g><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" x="1042" y="258">DANIELA</text><rect fill="#fff0f8" height="411" rx="25" stroke="#d53e91" stroke-width="2.5" width="550" x="35" y="306" /><rect fill="#d53e91" height="80" rx="24" width="550" x="35" y="306" /><rect fill="#d53e91" height="30" width="550" x="35" y="356" /><circle cx="78" cy="346" fill="#ffd067" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="355">01</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="355">LENGUA Y HABLANTES</text><text fill="#d53e91" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="423">Lenguaje · lengua · dialecto · habla</text><g fill="none" opacity="0.13" stroke="#d53e91" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,436) scale(0.85)"><rect fill="#d53e91" height="65" opacity="0.12" rx="14" width="116" x="4" y="5" /><polyline points="30,70 28,87 50,70" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="23" y2="23" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="38" y2="38" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="53" y2="53" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="481">• Lenguaje: capacidad humana de comunicar.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="511">• Lengua: sistema abstracto compartido.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="541">• Dialecto: variedad geográfica de una lengua.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="571">• Habla: realización individual y concreta.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="601">• El español de Canarias es una variedad</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="631">• legítima: seseo, aspiración, guagua...</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="661">• No confundas dialecto con incorrección.</text><line stroke="#d53e91" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="697" y2="697" /><rect fill="#fff0f8" height="411" rx="25" stroke="#d53e91" stroke-width="2.5" width="550" x="617" y="306" /><rect fill="#d53e91" height="80" rx="24" width="550" x="617" y="306" /><rect fill="#d53e91" height="30" width="550" x="617" y="356" /><circle cx="660" cy="346" fill="#ffd067" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="355">02</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="355">BILINGÜISMO Y DIGLOSIA</text><text fill="#d53e91" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="423">Conceptos y reflexión</text><g fill="none" opacity="0.13" stroke="#d53e91" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,436) scale(0.85)"><circle cx="62" cy="42" fill="#d53e91" opacity="0.13" r="37" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="5" x1="35" x2="90" y1="42" y2="42" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="4" x1="62" x2="62" y1="10" y2="74" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="481">• Bilingüismo: uso o conocimiento de</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="511">• dos lenguas por una persona o comunidad.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="541">• Diglosia: desigual valoración o reparto</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="571">• social de usos entre variedades o lenguas.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="601">• DLE: Diccionario de la lengua española.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="631">• Atención: las preguntas enmarcadas por</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="661">• el profesor son prioritarias para examen.</text><line stroke="#d53e91" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="697" y2="697" /><rect fill="#fff0f8" height="411" rx="25" stroke="#d53e91" stroke-width="2.5" width="550" x="35" y="743" /><rect fill="#d53e91" height="80" rx="24" width="550" x="35" y="743" /><rect fill="#d53e91" height="30" width="550" x="35" y="793" /><circle cx="78" cy="783" fill="#ffd067" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="792">03</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="792">TEXTO, CONTEXTO, SITUACIÓN</text><text fill="#d53e91" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="860">No todo se entiende literalmente</text><g fill="none" opacity="0.13" stroke="#d53e91" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,873) scale(0.85)"><rect fill="#d53e91" height="65" opacity="0.12" rx="14" width="116" x="4" y="5" /><polyline points="30,70 28,87 50,70" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="23" y2="23" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="38" y2="38" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="53" y2="53" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="918">• Texto: mensaje con unidad de sentido.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="948">• Contexto lingüístico: palabras cercanas.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="978">• Situación: participantes, lugar y momento.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1008">• Intención explícita: lo que se dice.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1038">• Intención implícita: lo que se pretende.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1068">• Ironía: decir algo y dar a entender otra cosa.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1098">• Presuposición: información dada por sentada.</text><line stroke="#d53e91" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1134" y2="1134" /><rect fill="#fff0f8" height="411" rx="25" stroke="#d53e91" stroke-width="2.5" width="550" x="617" y="743" /><rect fill="#d53e91" height="80" rx="24" width="550" x="617" y="743" /><rect fill="#d53e91" height="30" width="550" x="617" y="793" /><circle cx="660" cy="783" fill="#ffd067" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="792">04</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="792">LITERATURA DEL SIGLO XVIII</text><text fill="#d53e91" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="860">Ilustración y Neoclasicismo</text><g fill="none" opacity="0.13" stroke="#d53e91" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,873) scale(0.85)"><polygon fill="#d53e91" opacity="0.18" points="4,25 65,0 126,25" /><rect fill="#d53e91" height="48" opacity="0.5" width="12" x="18" y="29" /><rect fill="#d53e91" height="48" opacity="0.5" width="12" x="48" y="29" /><rect fill="#d53e91" height="48" opacity="0.5" width="12" x="78" y="29" /><rect fill="#d53e91" height="48" opacity="0.5" width="12" x="108" y="29" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="5" x1="2" x2="129" y1="79" y2="79" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="918">• La razón, la ciencia y la educación guían</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="948">• el pensamiento ilustrado del siglo XVIII.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="978">• Neoclasicismo: orden, claridad, utilidad.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1008">• Teatro: Leandro Fernández de Moratín.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1038">• Ensayo: Feijoo; prosa: José Cadalso.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1068">• Fábula didáctica: Tomás de Iriarte.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1098">• Canarias: José de Viera y Clavijo.</text><line stroke="#d53e91" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1134" y2="1134" /><rect fill="#fff0f8" height="411" rx="25" stroke="#d53e91" stroke-width="2.5" width="550" x="35" y="1180" /><rect fill="#d53e91" height="80" rx="24" width="550" x="35" y="1180" /><rect fill="#d53e91" height="30" width="550" x="35" y="1230" /><circle cx="78" cy="1220" fill="#ffd067" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="1229">05</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="1229">ETAPAS CULTURALES</text><text fill="#d53e91" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="1297">Situar la literatura en el tiempo</text><g fill="none" opacity="0.13" stroke="#d53e91" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,1310) scale(0.85)"><circle cx="60" cy="40" r="38" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="60" x2="60" y1="40" y2="15" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="60" x2="81" y1="40" y2="52" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="108" x2="108" y1="12" y2="70" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1355">• Edad Media → Edad Moderna →</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1385">• Edad Contemporánea (desde 1789).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1415">• Siglo XVIII: Ilustración y Neoclasicismo.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1445">• Siglo XIX: Romanticismo y Realismo.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1475">• Después: Modernismo y Vanguardias.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1505">• Relaciona cada movimiento con su</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1535">• contexto histórico y sus ideas.</text><line stroke="#d53e91" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1571" y2="1571" /><rect fill="#fff0f8" height="411" rx="25" stroke="#d53e91" stroke-width="2.5" width="550" x="617" y="1180" /><rect fill="#d53e91" height="80" rx="24" width="550" x="617" y="1180" /><rect fill="#d53e91" height="30" width="550" x="617" y="1230" /><circle cx="660" cy="1220" fill="#ffd067" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="1229">06</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="1229">PREGUNTAS DE EXAMEN</text><text fill="#d53e91" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="1297">Aprender a razonar con ejemplos</text><g fill="none" opacity="0.13" stroke="#d53e91" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,1310) scale(0.85)"><rect fill="#d53e91" height="65" opacity="0.12" rx="14" width="116" x="4" y="5" /><polyline points="30,70 28,87 50,70" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="23" y2="23" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="38" y2="38" /><line stroke="#d53e91" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="53" y2="53" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1355">• ¿Por qué una lengua es abstracta?</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1385">• ¿Es incorrecto decir «guagua»? ¿Por qué?</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1415">• Distingue lengua, dialecto y habla.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1445">• Explica la intención real de una ironía.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1475">• ¿Qué presupone una pregunta con «ya»?</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1505">• Reconoce autores y géneros del XVIII.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1535">• Responde usando ejemplos de las fichas.</text><line stroke="#d53e91" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1571" y2="1571" /><rect fill="#d53e91" height="42" rx="18" width="1130" x="35" y="1627" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" x="56" y="1655">REPASA · PRACTICA · EXPLICA CON TUS PALABRAS</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" x="1030" y="1655">TEMA 1</text></svg>