<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1697px" version="1.1" viewBox="0 0 1200 1697" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1697" width="1200" x="0" y="0" /><rect fill="#176bd1" height="280" width="1200" x="0" y="0" /><circle cx="30" cy="15" fill="#ffb02e" opacity="0.45" r="6" /><circle cx="113" cy="56" fill="#ffb02e" opacity="0.45" r="9" /><circle cx="196" cy="97" fill="#ffb02e" opacity="0.45" r="12" /><circle cx="279" cy="138" fill="#ffb02e" opacity="0.45" r="15" /><circle cx="362" cy="179" fill="#ffb02e" opacity="0.45" r="6" /><circle cx="445" cy="220" fill="#ffb02e" opacity="0.45" r="9" /><circle cx="528" cy="261" fill="#ffb02e" opacity="0.45" r="12" /><circle cx="611" cy="37" fill="#ffb02e" opacity="0.45" r="15" /><circle cx="694" cy="78" fill="#ffb02e" opacity="0.45" r="6" /><circle cx="777" cy="119" fill="#ffb02e" opacity="0.45" r="9" /><circle cx="860" cy="160" fill="#ffb02e" opacity="0.45" r="12" /><circle cx="943" cy="201" fill="#ffb02e" opacity="0.45" r="15" /><circle cx="1026" cy="242" fill="#ffb02e" opacity="0.45" r="6" /><circle cx="1109" cy="18" fill="#ffb02e" opacity="0.45" r="9" /><circle cx="1192" cy="59" fill="#ffb02e" opacity="0.45" r="12" /><circle cx="75" cy="100" fill="#ffb02e" opacity="0.45" r="15" /><circle cx="158" cy="141" fill="#ffb02e" opacity="0.45" r="6" /><circle cx="241" cy="182" fill="#ffb02e" opacity="0.45" r="9" /><rect fill="#ffffff" height="208" opacity="0.13" rx="30" width="770" x="42" y="34" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="bold" x="65" y="112">MATEMÁTICAS A</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" x="68" y="165">UD 1 · ESTADÍSTICA</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" x="68" y="212">INFOGRAFÍA ILUSTRADA · 4.º ESO · TEMA 1</text><g transform="translate(972,54)"><ellipse cx="70" cy="140" fill="#1675d2" rx="75" ry="47" /><path d="M16 120 Q-2 48 29 11 Q73 -23 113 13 Q151 49 125 126 L110 143 L33 143 Z" fill="#643b29" stroke="#3c2421" stroke-width="3" /><ellipse cx="72" cy="70" fill="#ffd0a6" rx="49" ry="60" stroke="#9d6249" stroke-width="2" /><path d="M23 49 Q32 -10 75 9 Q109 4 121 53 Q87 30 65 27 Q40 42 23 49" fill="#613421" /><circle cx="52" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="52" cy="75" fill="#142b48" r="4" /><circle cx="93" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="93" cy="75" fill="#142b48" r="4" /><line stroke="#15264e" stroke-linecap="round" stroke-width="4" x1="71" x2="74" y1="74" y2="74" /><path d="M58 104 Q74 119 91 102" fill="none" stroke="#ad4e5b" stroke-linecap="round" stroke-width="4" /><path d="M20 148 Q73 118 123 150" fill="none" stroke="#09539b" stroke-width="5" /></g><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" x="1042" y="258">DANIELA</text><rect fill="#e7f2ff" height="411" rx="25" stroke="#176bd1" stroke-width="2.5" width="550" x="35" y="306" /><rect fill="#176bd1" height="80" rx="24" width="550" x="35" y="306" /><rect fill="#176bd1" height="30" width="550" x="35" y="356" /><circle cx="78" cy="346" fill="#ffb02e" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="355">01</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="355">ESTUDIOS ESTADÍSTICOS</text><text fill="#176bd1" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="423">Población, muestra y variables</text><g fill="none" opacity="0.13" stroke="#176bd1" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,436) scale(0.85)"><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="130" y1="80" y2="80" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="0" y1="80" y2="0" /><rect fill="#176bd1" height="34" opacity="0.65" rx="3" width="15" x="12" y="46" /><rect fill="#176bd1" height="60" opacity="0.65" rx="3" width="15" x="35" y="20" /><rect fill="#176bd1" height="45" opacity="0.65" rx="3" width="15" x="58" y="35" /><rect fill="#176bd1" height="74" opacity="0.65" rx="3" width="15" x="81" y="6" /><rect fill="#176bd1" height="51" opacity="0.65" rx="3" width="15" x="104" y="29" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="481">• Población: conjunto de individuos estudiados.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="511">• Muestra: parte de la población seleccionada.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="541">• Variable cualitativa: categorías o cualidades.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="571">• Cuantitativa discreta: valores contables.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="601">• Cuantitativa continua: valores en intervalos.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="631">• Frecuencias: absoluta (fi), relativa (hi = fi/n)</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="661">• y acumulada (Fi). Marca de clase: punto medio.</text><line stroke="#176bd1" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="697" y2="697" /><rect fill="#e7f2ff" height="411" rx="25" stroke="#176bd1" stroke-width="2.5" width="550" x="617" y="306" /><rect fill="#176bd1" height="80" rx="24" width="550" x="617" y="306" /><rect fill="#176bd1" height="30" width="550" x="617" y="356" /><circle cx="660" cy="346" fill="#ffb02e" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="355">02</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="355">GRÁFICOS ESTADÍSTICOS</text><text fill="#176bd1" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="423">Elegir la representación adecuada</text><g fill="none" opacity="0.13" stroke="#176bd1" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,436) scale(0.85)"><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="130" y1="80" y2="80" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="0" y1="80" y2="0" /><rect fill="#176bd1" height="34" opacity="0.65" rx="3" width="15" x="12" y="46" /><rect fill="#176bd1" height="60" opacity="0.65" rx="3" width="15" x="35" y="20" /><rect fill="#176bd1" height="45" opacity="0.65" rx="3" width="15" x="58" y="35" /><rect fill="#176bd1" height="74" opacity="0.65" rx="3" width="15" x="81" y="6" /><rect fill="#176bd1" height="51" opacity="0.65" rx="3" width="15" x="104" y="29" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="481">• Barras: cualitativas y discretas.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="511">• Sectores: partes de un total.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="541">• Histograma: variables continuas agrupadas.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="571">• Polígono: une frecuencias por marcas de clase.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="601">• Barras adosadas: comparar distribuciones.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="631">• Cartogramas: datos representados en mapas.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="661">• La elección depende del tipo de variable.</text><line stroke="#176bd1" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="697" y2="697" /><rect fill="#e7f2ff" height="411" rx="25" stroke="#176bd1" stroke-width="2.5" width="550" x="35" y="743" /><rect fill="#176bd1" height="80" rx="24" width="550" x="35" y="743" /><rect fill="#176bd1" height="30" width="550" x="35" y="793" /><circle cx="78" cy="783" fill="#ffb02e" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="792">03</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="792">CENTRALIZACIÓN</text><text fill="#176bd1" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="860">Media, mediana y moda</text><g fill="none" opacity="0.13" stroke="#176bd1" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,873) scale(0.85)"><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="130" y1="80" y2="80" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="0" y1="80" y2="0" /><rect fill="#176bd1" height="34" opacity="0.65" rx="3" width="15" x="12" y="46" /><rect fill="#176bd1" height="60" opacity="0.65" rx="3" width="15" x="35" y="20" /><rect fill="#176bd1" height="45" opacity="0.65" rx="3" width="15" x="58" y="35" /><rect fill="#176bd1" height="74" opacity="0.65" rx="3" width="15" x="81" y="6" /><rect fill="#176bd1" height="51" opacity="0.65" rx="3" width="15" x="104" y="29" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="918">• Media aritmética: x̄ = Σ(xi · fi) / n.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="948">• Mediana (Me): valor central al ordenar.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="978">• Moda (Mo): valor con mayor frecuencia.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1008">• En intervalos: usar marcas de clase para</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1038">• aproximar la media; intervalo modal y</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1068">• mediano para localizar moda y mediana.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1098">• Ejemplo: 2, 3, 3, 8 → Mo = 3; Me = 3.</text><line stroke="#176bd1" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1134" y2="1134" /><rect fill="#e7f2ff" height="411" rx="25" stroke="#176bd1" stroke-width="2.5" width="550" x="617" y="743" /><rect fill="#176bd1" height="80" rx="24" width="550" x="617" y="743" /><rect fill="#176bd1" height="30" width="550" x="617" y="793" /><circle cx="660" cy="783" fill="#ffb02e" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="792">04</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="792">POSICIÓN</text><text fill="#176bd1" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="860">Cuartiles, deciles y percentiles</text><g fill="none" opacity="0.13" stroke="#176bd1" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,873) scale(0.85)"><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="130" y1="80" y2="80" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="0" y1="80" y2="0" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="20" x2="20" y1="25" y2="85" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="50" x2="50" y1="25" y2="85" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="80" x2="80" y1="25" y2="85" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="110" x2="110" y1="25" y2="85" /><rect fill="#176bd1" height="26" opacity="0.3" width="30" x="50" y="38" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="918">• Q1: deja el 25 % de datos por debajo.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="948">• Q2 = mediana: deja el 50 %.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="978">• Q3: deja el 75 %.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1008">• Deciles: dividen en 10 partes.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1038">• Percentiles: dividen en 100 partes.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1068">• Equivalencias: P25 = Q1; P50 = Q2 = Me;</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1098">• P75 = Q3. Ordena los datos primero.</text><line stroke="#176bd1" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1134" y2="1134" /><rect fill="#e7f2ff" height="411" rx="25" stroke="#176bd1" stroke-width="2.5" width="550" x="35" y="1180" /><rect fill="#176bd1" height="80" rx="24" width="550" x="35" y="1180" /><rect fill="#176bd1" height="30" width="550" x="35" y="1230" /><circle cx="78" cy="1220" fill="#ffb02e" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="1229">05</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="1229">DISPERSIÓN</text><text fill="#176bd1" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="1297">¿Cuánto se separan los datos?</text><g fill="none" opacity="0.13" stroke="#176bd1" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,1310) scale(0.85)"><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="130" y1="80" y2="80" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="0" y1="80" y2="0" /><rect fill="#176bd1" height="34" opacity="0.65" rx="3" width="15" x="12" y="46" /><rect fill="#176bd1" height="60" opacity="0.65" rx="3" width="15" x="35" y="20" /><rect fill="#176bd1" height="45" opacity="0.65" rx="3" width="15" x="58" y="35" /><rect fill="#176bd1" height="74" opacity="0.65" rx="3" width="15" x="81" y="6" /><rect fill="#176bd1" height="51" opacity="0.65" rx="3" width="15" x="104" y="29" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1355">• Rango: máximo − mínimo.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1385">• Desviación media: promedio de |xi − x̄|.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1415">• Varianza: promedio de (xi − x̄)².</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1445">• Desviación típica: raíz de la varianza.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1475">• Coeficiente de variación: σ / x̄ (si x̄ ≠ 0).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1505">• A mayor dispersión, menos agrupados</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1535">• están los valores alrededor de la media.</text><line stroke="#176bd1" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1571" y2="1571" /><rect fill="#e7f2ff" height="411" rx="25" stroke="#176bd1" stroke-width="2.5" width="550" x="617" y="1180" /><rect fill="#176bd1" height="80" rx="24" width="550" x="617" y="1180" /><rect fill="#176bd1" height="30" width="550" x="617" y="1230" /><circle cx="660" cy="1220" fill="#ffb02e" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="1229">06</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="1229">DOS VARIABLES</text><text fill="#176bd1" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="1297">Correlación y nube de puntos</text><g fill="none" opacity="0.13" stroke="#176bd1" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,1310) scale(0.85)"><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="130" y1="80" y2="80" /><line stroke="#176bd1" stroke-linecap="round" stroke-width="3" x1="0" x2="0" y1="80" y2="0" /><circle cx="12" cy="65" fill="#176bd1" r="5" /><circle cx="28" cy="48" fill="#176bd1" r="5" /><circle cx="40" cy="54" fill="#176bd1" r="5" /><circle cx="56" cy="35" fill="#176bd1" r="5" /><circle cx="74" cy="30" fill="#176bd1" r="5" /><circle cx="90" cy="18" fill="#176bd1" r="5" /><circle cx="110" cy="12" fill="#176bd1" r="5" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1355">• Cada individuo aporta un par (x, y).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1385">• La nube de puntos permite ver la relación.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1415">• Correlación positiva: ambas aumentan.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1445">• Correlación negativa: una baja si otra sube.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1475">• Correlación nula: no se aprecia tendencia.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1505">• Tabla de doble entrada: frecuencias conjuntas.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1535">• Marginales: totales de filas y columnas.</text><line stroke="#176bd1" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1571" y2="1571" /><rect fill="#176bd1" height="42" rx="18" width="1130" x="35" y="1627" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" x="56" y="1655">REPASA · PRACTICA · EXPLICA CON TUS PALABRAS</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" x="1030" y="1655">TEMA 1</text></svg>