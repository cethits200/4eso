<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1697px" version="1.1" viewBox="0 0 1200 1697" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1697" width="1200" x="0" y="0" /><rect fill="#9250cf" height="280" width="1200" x="0" y="0" /><circle cx="30" cy="15" fill="#f8c45c" opacity="0.45" r="6" /><circle cx="113" cy="56" fill="#f8c45c" opacity="0.45" r="9" /><circle cx="196" cy="97" fill="#f8c45c" opacity="0.45" r="12" /><circle cx="279" cy="138" fill="#f8c45c" opacity="0.45" r="15" /><circle cx="362" cy="179" fill="#f8c45c" opacity="0.45" r="6" /><circle cx="445" cy="220" fill="#f8c45c" opacity="0.45" r="9" /><circle cx="528" cy="261" fill="#f8c45c" opacity="0.45" r="12" /><circle cx="611" cy="37" fill="#f8c45c" opacity="0.45" r="15" /><circle cx="694" cy="78" fill="#f8c45c" opacity="0.45" r="6" /><circle cx="777" cy="119" fill="#f8c45c" opacity="0.45" r="9" /><circle cx="860" cy="160" fill="#f8c45c" opacity="0.45" r="12" /><circle cx="943" cy="201" fill="#f8c45c" opacity="0.45" r="15" /><circle cx="1026" cy="242" fill="#f8c45c" opacity="0.45" r="6" /><circle cx="1109" cy="18" fill="#f8c45c" opacity="0.45" r="9" /><circle cx="1192" cy="59" fill="#f8c45c" opacity="0.45" r="12" /><circle cx="75" cy="100" fill="#f8c45c" opacity="0.45" r="15" /><circle cx="158" cy="141" fill="#f8c45c" opacity="0.45" r="6" /><circle cx="241" cy="182" fill="#f8c45c" opacity="0.45" r="9" /><rect fill="#ffffff" height="208" opacity="0.13" rx="30" width="770" x="42" y="34" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="bold" x="65" y="112">LATÍN</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" x="68" y="165">TEMA 1 · LENGUA, GRAMÁTICA Y ROMA</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" x="68" y="212">INFOGRAFÍA ILUSTRADA · 4.º ESO · TEMA 1</text><g transform="translate(972,54)"><ellipse cx="70" cy="140" fill="#1675d2" rx="75" ry="47" /><path d="M16 120 Q-2 48 29 11 Q73 -23 113 13 Q151 49 125 126 L110 143 L33 143 Z" fill="#643b29" stroke="#3c2421" stroke-width="3" /><ellipse cx="72" cy="70" fill="#ffd0a6" rx="49" ry="60" stroke="#9d6249" stroke-width="2" /><path d="M23 49 Q32 -10 75 9 Q109 4 121 53 Q87 30 65 27 Q40 42 23 49" fill="#613421" /><circle cx="52" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="52" cy="75" fill="#142b48" r="4" /><circle cx="93" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="93" cy="75" fill="#142b48" r="4" /><line stroke="#15264e" stroke-linecap="round" stroke-width="4" x1="71" x2="74" y1="74" y2="74" /><path d="M58 104 Q74 119 91 102" fill="none" stroke="#ad4e5b" stroke-linecap="round" stroke-width="4" /><path d="M20 148 Q73 118 123 150" fill="none" stroke="#09539b" stroke-width="5" /></g><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" x="1042" y="258">DANIELA</text><rect fill="#f6efff" height="411" rx="25" stroke="#9250cf" stroke-width="2.5" width="550" x="35" y="306" /><rect fill="#9250cf" height="80" rx="24" width="550" x="35" y="306" /><rect fill="#9250cf" height="30" width="550" x="35" y="356" /><circle cx="78" cy="346" fill="#f8c45c" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="355">01</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="355">ORIGEN DEL LATÍN</text><text fill="#9250cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="423">Del indoeuropeo a las romances</text><g fill="none" opacity="0.13" stroke="#9250cf" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,436) scale(0.85)"><polygon fill="#9250cf" opacity="0.18" points="4,25 65,0 126,25" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="18" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="48" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="78" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="108" y="29" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="5" x1="2" x2="129" y1="79" y2="79" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="481">• El latín pertenece a la familia indoeuropea.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="511">• El indoeuropeo se reconstruye comparando</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="541">• las lenguas derivadas: no dejó textos.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="571">• El latín dio origen a lenguas romances:</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="601">• español, italiano, francés, portugués...</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="631">• Latín clásico y latín vulgar: usos distintos.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="661">• La herencia latina sigue en el vocabulario.</text><line stroke="#9250cf" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="697" y2="697" /><rect fill="#f6efff" height="411" rx="25" stroke="#9250cf" stroke-width="2.5" width="550" x="617" y="306" /><rect fill="#9250cf" height="80" rx="24" width="550" x="617" y="306" /><rect fill="#9250cf" height="30" width="550" x="617" y="356" /><circle cx="660" cy="346" fill="#f8c45c" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="355">02</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="355">PRIMERA DECLINACIÓN</text><text fill="#9250cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="423">Seis casos · singular y plural</text><g fill="none" opacity="0.13" stroke="#9250cf" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,436) scale(0.85)"><polygon fill="#9250cf" opacity="0.18" points="4,25 65,0 126,25" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="18" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="48" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="78" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="108" y="29" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="5" x1="2" x2="129" y1="79" y2="79" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="481">• Nominativo: puella / puellae (sujeto).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="511">• Vocativo: puella / puellae (llamada).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="541">• Acusativo: puellam / puellās (CD).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="571">• Genitivo: puellae / puellārum (CN).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="601">• Dativo: puellae / puellīs (CI).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="631">• Ablativo: puellā / puellīs (CC).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="661">• Identifica caso, número y función.</text><line stroke="#9250cf" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="697" y2="697" /><rect fill="#f6efff" height="411" rx="25" stroke="#9250cf" stroke-width="2.5" width="550" x="35" y="743" /><rect fill="#9250cf" height="80" rx="24" width="550" x="35" y="743" /><rect fill="#9250cf" height="30" width="550" x="35" y="793" /><circle cx="78" cy="783" fill="#f8c45c" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="792">03</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="792">VERBOS Y TRADUCCIÓN</text><text fill="#9250cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="860">Presente · imperfecto</text><g fill="none" opacity="0.13" stroke="#9250cf" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,873) scale(0.85)"><rect fill="#9250cf" height="65" opacity="0.12" rx="14" width="116" x="4" y="5" /><polyline points="30,70 28,87 50,70" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="23" y2="23" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="38" y2="38" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="53" y2="53" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="918">• SUM: sum, es, est, sumus, estis, sunt.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="948">• Imperfecto: eram, eras, erat, eramus...</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="978">• 1.ª conj. presente: amo, amas, amat...</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1008">• Imperfecto regular: amābam, amābās...</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1038">• Busca primero el verbo y el sujeto.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1068">• Analiza desinencias antes de traducir.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1098">• Respeta las funciones, no el orden literal.</text><line stroke="#9250cf" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1134" y2="1134" /><rect fill="#f6efff" height="411" rx="25" stroke="#9250cf" stroke-width="2.5" width="550" x="617" y="743" /><rect fill="#9250cf" height="80" rx="24" width="550" x="617" y="743" /><rect fill="#9250cf" height="30" width="550" x="617" y="793" /><circle cx="660" cy="783" fill="#f8c45c" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="792">04</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="792">LATÍN PRÁCTICO</text><text fill="#9250cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="860">Loquimur Latine · textos</text><g fill="none" opacity="0.13" stroke="#9250cf" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,873) scale(0.85)"><rect fill="#9250cf" height="65" opacity="0.12" rx="14" width="116" x="4" y="5" /><polyline points="30,70 28,87 50,70" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="23" y2="23" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="38" y2="38" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="53" y2="53" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="918">• Salve! / Salvete! · Vale! / Valete!</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="948">• Presentarse y usar números del 1 al 20.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="978">• Vocabulario y pequeños diálogos.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1008">• Textos: Flavia, Piratae, Bona ancilla,</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1038">• Minerva et Diana, Columbae et formicae,</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1068">• Galba y Nauta; Colloquia Latina.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1098">• Repasa traducción y léxico en contexto.</text><line stroke="#9250cf" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1134" y2="1134" /><rect fill="#f6efff" height="411" rx="25" stroke="#9250cf" stroke-width="2.5" width="550" x="35" y="1180" /><rect fill="#9250cf" height="80" rx="24" width="550" x="35" y="1180" /><rect fill="#9250cf" height="30" width="550" x="35" y="1230" /><circle cx="78" cy="1220" fill="#f8c45c" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="1229">05</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="1229">MONARQUÍA ROMANA</text><text fill="#9250cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="1297">753–509 a. C. · siete reyes</text><g fill="none" opacity="0.13" stroke="#9250cf" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,1310) scale(0.85)"><polygon fill="#9250cf" opacity="0.18" points="4,25 65,0 126,25" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="18" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="48" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="78" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="108" y="29" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="5" x1="2" x2="129" y1="79" y2="79" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1355">• Cuatro reyes latino-sabinos y tres etruscos.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1385">• Primer rey: Rómulo; último: Tarquinio</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1415">• el Soberbio. El Senado aconsejaba al rey.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1445">• Auspicium: interpretación de signos divinos.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1475">• Imperium: poder militar y judicial.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1505">• Símbolos: fasces, silla curul, toga picta.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1535">• Tras la monarquía comenzó la República.</text><line stroke="#9250cf" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1571" y2="1571" /><rect fill="#f6efff" height="411" rx="25" stroke="#9250cf" stroke-width="2.5" width="550" x="617" y="1180" /><rect fill="#9250cf" height="80" rx="24" width="550" x="617" y="1180" /><rect fill="#9250cf" height="30" width="550" x="617" y="1230" /><circle cx="660" cy="1220" fill="#f8c45c" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="1229">06</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="1229">PERSONAJES Y LEGADO</text><text fill="#9250cf" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="1297">Historia, mito y cultura</text><g fill="none" opacity="0.13" stroke="#9250cf" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,1310) scale(0.85)"><polygon fill="#9250cf" opacity="0.18" points="4,25 65,0 126,25" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="18" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="48" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="78" y="29" /><rect fill="#9250cf" height="48" opacity="0.5" width="12" x="108" y="29" /><line stroke="#9250cf" stroke-linecap="round" stroke-width="5" x1="2" x2="129" y1="79" y2="79" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1355">• Tarquino el Soberbio: último monarca.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1385">• El episodio de Lucrecia y Sexto Tarquinio</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1415">• se vincula a la caída de la monarquía.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1445">• Libros sibilinos: profecías religiosas.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1475">• Roma transmitió derecho, cultura y lengua.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1505">• Consejo: relaciona fechas, nombres y</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1535">• conceptos con las fichas de clase.</text><line stroke="#9250cf" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1571" y2="1571" /><rect fill="#9250cf" height="42" rx="18" width="1130" x="35" y="1627" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" x="56" y="1655">REPASA · PRACTICA · EXPLICA CON TUS PALABRAS</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" x="1030" y="1655">TEMA 1</text></svg>