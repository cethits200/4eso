<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1697px" version="1.1" viewBox="0 0 1200 1697" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1697" width="1200" x="0" y="0" /><rect fill="#078b77" height="280" width="1200" x="0" y="0" /><circle cx="30" cy="15" fill="#ffcd6a" opacity="0.45" r="6" /><circle cx="113" cy="56" fill="#ffcd6a" opacity="0.45" r="9" /><circle cx="196" cy="97" fill="#ffcd6a" opacity="0.45" r="12" /><circle cx="279" cy="138" fill="#ffcd6a" opacity="0.45" r="15" /><circle cx="362" cy="179" fill="#ffcd6a" opacity="0.45" r="6" /><circle cx="445" cy="220" fill="#ffcd6a" opacity="0.45" r="9" /><circle cx="528" cy="261" fill="#ffcd6a" opacity="0.45" r="12" /><circle cx="611" cy="37" fill="#ffcd6a" opacity="0.45" r="15" /><circle cx="694" cy="78" fill="#ffcd6a" opacity="0.45" r="6" /><circle cx="777" cy="119" fill="#ffcd6a" opacity="0.45" r="9" /><circle cx="860" cy="160" fill="#ffcd6a" opacity="0.45" r="12" /><circle cx="943" cy="201" fill="#ffcd6a" opacity="0.45" r="15" /><circle cx="1026" cy="242" fill="#ffcd6a" opacity="0.45" r="6" /><circle cx="1109" cy="18" fill="#ffcd6a" opacity="0.45" r="9" /><circle cx="1192" cy="59" fill="#ffcd6a" opacity="0.45" r="12" /><circle cx="75" cy="100" fill="#ffcd6a" opacity="0.45" r="15" /><circle cx="158" cy="141" fill="#ffcd6a" opacity="0.45" r="6" /><circle cx="241" cy="182" fill="#ffcd6a" opacity="0.45" r="9" /><rect fill="#ffffff" height="208" opacity="0.13" rx="30" width="770" x="42" y="34" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="bold" x="65" y="112">GEOGRAFÍA E HISTORIA</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" x="68" y="165">UD 1 · DE SIERVOS A CIUDADANOS</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" x="68" y="212">INFOGRAFÍA ILUSTRADA · 4.º ESO · TEMA 1</text><g transform="translate(972,54)"><ellipse cx="70" cy="140" fill="#1675d2" rx="75" ry="47" /><path d="M16 120 Q-2 48 29 11 Q73 -23 113 13 Q151 49 125 126 L110 143 L33 143 Z" fill="#643b29" stroke="#3c2421" stroke-width="3" /><ellipse cx="72" cy="70" fill="#ffd0a6" rx="49" ry="60" stroke="#9d6249" stroke-width="2" /><path d="M23 49 Q32 -10 75 9 Q109 4 121 53 Q87 30 65 27 Q40 42 23 49" fill="#613421" /><circle cx="52" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="52" cy="75" fill="#142b48" r="4" /><circle cx="93" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="93" cy="75" fill="#142b48" r="4" /><line stroke="#15264e" stroke-linecap="round" stroke-width="4" x1="71" x2="74" y1="74" y2="74" /><path d="M58 104 Q74 119 91 102" fill="none" stroke="#ad4e5b" stroke-linecap="round" stroke-width="4" /><path d="M20 148 Q73 118 123 150" fill="none" stroke="#09539b" stroke-width="5" /></g><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" x="1042" y="258">DANIELA</text><rect fill="#e8faf5" height="411" rx="25" stroke="#078b77" stroke-width="2.5" width="550" x="35" y="306" /><rect fill="#078b77" height="80" rx="24" width="550" x="35" y="306" /><rect fill="#078b77" height="30" width="550" x="35" y="356" /><circle cx="78" cy="346" fill="#ffcd6a" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="355">01</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="355">ANTIGUO RÉGIMEN</text><text fill="#078b77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="423">Monarquía absoluta y estamentos</text><g fill="none" opacity="0.13" stroke="#078b77" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,436) scale(0.85)"><circle cx="62" cy="42" fill="#078b77" opacity="0.13" r="37" /><line stroke="#078b77" stroke-linecap="round" stroke-width="5" x1="35" x2="90" y1="42" y2="42" /><line stroke="#078b77" stroke-linecap="round" stroke-width="4" x1="62" x2="62" y1="10" y2="74" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="481">• Sociedad: clero y nobleza privilegiados;</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="511">• Tercer Estado sin los mismos privilegios.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="541">• Economía mayoritariamente agraria.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="571">• Campesinos: rentas, impuestos y cargas.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="601">• Burguesía: riqueza comercial, pero menor</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="631">• acceso al poder político.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="661">• Las desigualdades alimentaron la crisis.</text><line stroke="#078b77" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="697" y2="697" /><rect fill="#e8faf5" height="411" rx="25" stroke="#078b77" stroke-width="2.5" width="550" x="617" y="306" /><rect fill="#078b77" height="80" rx="24" width="550" x="617" y="306" /><rect fill="#078b77" height="30" width="550" x="617" y="356" /><circle cx="660" cy="346" fill="#ffcd6a" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="355">02</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="355">ILUSTRACIÓN</text><text fill="#078b77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="423">Razón, ciencia y educación</text><g fill="none" opacity="0.13" stroke="#078b77" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,436) scale(0.85)"><circle cx="62" cy="42" fill="#078b77" opacity="0.13" r="37" /><line stroke="#078b77" stroke-linecap="round" stroke-width="5" x1="35" x2="90" y1="42" y2="42" /><line stroke="#078b77" stroke-linecap="round" stroke-width="4" x1="62" x2="62" y1="10" y2="74" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="481">• Crítica a la superstición y los privilegios.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="511">• Enciclopedia: Diderot y D'Alembert.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="541">• Despotismo ilustrado: reformas sin</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="571">• ceder el poder absoluto del monarca.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="601">• «Todo para el pueblo, pero sin el pueblo».</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="631">• Parlamentarismo: límite al poder real.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="661">• Inglaterra: Habeas Corpus y Bill of Rights.</text><line stroke="#078b77" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="697" y2="697" /><rect fill="#e8faf5" height="411" rx="25" stroke="#078b77" stroke-width="2.5" width="550" x="35" y="743" /><rect fill="#078b77" height="80" rx="24" width="550" x="35" y="743" /><rect fill="#078b77" height="30" width="550" x="35" y="793" /><circle cx="78" cy="783" fill="#ffcd6a" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="792">03</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="792">INDEPENDENCIA DE EE. UU.</text><text fill="#078b77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="860">De las colonias a una república</text><g fill="none" opacity="0.13" stroke="#078b77" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,873) scale(0.85)"><circle cx="62" cy="42" fill="#078b77" opacity="0.13" r="37" /><line stroke="#078b77" stroke-linecap="round" stroke-width="5" x1="35" x2="90" y1="42" y2="42" /><line stroke="#078b77" stroke-linecap="round" stroke-width="4" x1="62" x2="62" y1="10" y2="74" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="918">• 1773: motín del té de Boston.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="948">• 1775: comienza la guerra contra Gran Bretaña.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="978">• 4 de julio de 1776: independencia.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1008">• 1783: reconocimiento británico.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1038">• 1787: Constitución de Estados Unidos.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1068">• 1789: George Washington, presidente.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1098">• Influencia en las revoluciones liberales.</text><line stroke="#078b77" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1134" y2="1134" /><rect fill="#e8faf5" height="411" rx="25" stroke="#078b77" stroke-width="2.5" width="550" x="617" y="743" /><rect fill="#078b77" height="80" rx="24" width="550" x="617" y="743" /><rect fill="#078b77" height="30" width="550" x="617" y="793" /><circle cx="660" cy="783" fill="#ffcd6a" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="792">04</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="792">LOS BORBONES EN ESPAÑA</text><text fill="#078b77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="860">La Guerra de Sucesión</text><g fill="none" opacity="0.13" stroke="#078b77" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,873) scale(0.85)"><polygon fill="#078b77" opacity="0.18" points="4,25 65,0 126,25" /><rect fill="#078b77" height="48" opacity="0.5" width="12" x="18" y="29" /><rect fill="#078b77" height="48" opacity="0.5" width="12" x="48" y="29" /><rect fill="#078b77" height="48" opacity="0.5" width="12" x="78" y="29" /><rect fill="#078b77" height="48" opacity="0.5" width="12" x="108" y="29" /><line stroke="#078b77" stroke-linecap="round" stroke-width="5" x1="2" x2="129" y1="79" y2="79" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="918">• 1700: muere Carlos II sin descendencia.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="948">• Felipe de Borbón frente a Carlos de Austria.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="978">• 1701: comienza la Guerra de Sucesión.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1008">• Castilla apoyó a Felipe V; buena parte de</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1038">• la Corona de Aragón, al archiduque Carlos.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1068">• 1713: Paz de Utrecht; Felipe V reconocido.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1098">• Reformas y centralización borbónicas.</text><line stroke="#078b77" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1134" y2="1134" /><rect fill="#e8faf5" height="411" rx="25" stroke="#078b77" stroke-width="2.5" width="550" x="35" y="1180" /><rect fill="#078b77" height="80" rx="24" width="550" x="35" y="1180" /><rect fill="#078b77" height="30" width="550" x="35" y="1230" /><circle cx="78" cy="1220" fill="#ffcd6a" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="1229">05</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="1229">REVOLUCIÓN FRANCESA</text><text fill="#078b77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="1297">De 1789 al Directorio</text><g fill="none" opacity="0.13" stroke="#078b77" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,1310) scale(0.85)"><circle cx="60" cy="40" r="38" /><line stroke="#078b77" stroke-linecap="round" stroke-width="3" x1="60" x2="60" y1="40" y2="15" /><line stroke="#078b77" stroke-linecap="round" stroke-width="3" x1="60" x2="81" y1="40" y2="52" /><line stroke="#078b77" stroke-linecap="round" stroke-width="3" x1="108" x2="108" y1="12" y2="70" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1355">• Causas: crisis fiscal, desigualdad y nuevas</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1385">• ideas de soberanía, libertad e igualdad.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1415">• 1789: Estados Generales, Asamblea</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1445">• Nacional y toma de la Bastilla (14 julio).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1475">• 1791: Constitución y monarquía limitada.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1505">• 1792: República; 1793–94: Terror.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1535">• 1795–99: Directorio; después Napoleón.</text><line stroke="#078b77" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1571" y2="1571" /><rect fill="#e8faf5" height="411" rx="25" stroke="#078b77" stroke-width="2.5" width="550" x="617" y="1180" /><rect fill="#078b77" height="80" rx="24" width="550" x="617" y="1180" /><rect fill="#078b77" height="30" width="550" x="617" y="1230" /><circle cx="660" cy="1220" fill="#ffcd6a" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="1229">06</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="1229">CAMBIO REVOLUCIONARIO</text><text fill="#078b77" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="1297">De súbditos a ciudadanos</text><g fill="none" opacity="0.13" stroke="#078b77" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,1310) scale(0.85)"><polygon fill="#078b77" opacity="0.18" points="4,25 65,0 126,25" /><rect fill="#078b77" height="48" opacity="0.5" width="12" x="18" y="29" /><rect fill="#078b77" height="48" opacity="0.5" width="12" x="48" y="29" /><rect fill="#078b77" height="48" opacity="0.5" width="12" x="78" y="29" /><rect fill="#078b77" height="48" opacity="0.5" width="12" x="108" y="29" /><line stroke="#078b77" stroke-linecap="round" stroke-width="5" x1="2" x2="129" y1="79" y2="79" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1355">• Se cuestiona el absolutismo y el orden</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1385">• estamental del Antiguo Régimen.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1415">• Soberanía nacional y separación de poderes.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1445">• Declaración de Derechos de 1789.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1475">• Igualdad ante la ley como principio político.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1505">• Los derechos no se extendieron por igual</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1535">• a mujeres ni a personas esclavizadas.</text><line stroke="#078b77" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1571" y2="1571" /><rect fill="#078b77" height="42" rx="18" width="1130" x="35" y="1627" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" x="56" y="1655">REPASA · PRACTICA · EXPLICA CON TUS PALABRAS</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" x="1030" y="1655">TEMA 1</text></svg>