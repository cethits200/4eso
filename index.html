const geoSummary=`<div class="card"><h2>1. El Antiguo Régimen</h2><p>Sistema político, económico y social predominante en la Europa del siglo XVIII. Se caracterizaba por una agricultura tradicional de subsistencia, una sociedad estamental y la monarquía absoluta.</p><h3>Sociedad estamental</h3><p><b>Privilegiados:</b> nobleza y clero. No pagaban impuestos, poseían tierras y disfrutaban de privilegios jurídicos. La Iglesia recibía el diezmo.</p><p><b>No privilegiados:</b> Tercer Estado: campesinos, servidumbre, artesanos, comerciantes y burgueses. Carecían de derechos y soportaban impuestos, rentas y derechos señoriales.</p></div>
<div class="card"><h2>2. Ilustración y despotismo ilustrado</h2><p>La Ilustración nació en el siglo XVIII, con Francia como centro fundamental. Defendía la razón y la observación frente a la tradición, la religión y la superstición. Diderot y D’Alembert dirigieron la <b>Enciclopedia</b>.</p><p>El <b>despotismo ilustrado</b> aplicó reformas sin cuestionar el absolutismo ni los privilegios: «Todo para el pueblo, pero sin el pueblo».</p></div>
<div class="card"><h2>3. Parlamentarismo e independencia de EE. UU.</h2><p>Inglaterra y Países Bajos mostraron que era posible limitar el absolutismo. En Inglaterra destacan el <b>Habeas Corpus (1679)</b> y el <b>Bill of Rights (1689)</b>.</p><p>Las Trece Colonias se enfrentaron a Gran Bretaña: Motín del Té (1773), guerra (1775), Declaración de Independencia (1776), reconocimiento británico (1783) y Constitución (1787). George Washington fue elegido presidente en 1789.</p></div>
<div class="card"><h2>4. Los Borbones en España</h2><p>Tras morir Carlos II sin descendencia en 1700, Felipe de Borbón y Carlos de Habsburgo disputaron el trono en la <b>Guerra de Sucesión (1701-1713)</b>. La Paz de Utrecht (1713) reconoció a Felipe V como rey de España y consolidó a Gran Bretaña como potencia principal.</p></div>
<div class="card"><h2>5. Revolución francesa (1789-1799)</h2><p><b>Causas:</b> desigualdad estamental, dificultades de campesinos y trabajadores, aspiraciones políticas de la burguesía, influencia ilustrada y americana y grave crisis financiera de la monarquía.</p><p><b>1789:</b> Estados Generales → Asamblea Nacional → asalto a la Bastilla (14 de julio). Se abolieron privilegios y derechos señoriales y se aprobó la Declaración de los Derechos del Hombre y del Ciudadano.</p><p><b>1791:</b> monarquía constitucional: soberanía nacional, separación de poderes, igualdad ante la ley y sufragio censitario.</p><p><b>1792:</b> caída de la monarquía y proclamación de la República mediante sufragio universal masculino. Girondinos y jacobinos fueron las principales tendencias republicanas.</p><p><b>1793-1794:</b> ejecución de Luis XVI y María Antonieta. Los jacobinos, dirigidos por Robespierre, implantaron medidas sociales y el <b>Terror</b>.</p><p><b>1795-1799:</b> Directorio, régimen moderado e inestable. En 1799 Napoleón Bonaparte dio un golpe de Estado y estableció el Consulado, hecho considerado final de la Revolución.</p></div>
<div class="card"><h2>6. Importancia de la Revolución</h2><p>Contribuyó al fin de los privilegios estamentales y difundió la igualdad jurídica, soberanía nacional, Constitución, derechos y libertades, separación de poderes, propiedad privada y libertad económica. Sus principios impulsaron el liberalismo y cuestionaron el absolutismo europeo.</p><p class="muted"><b>Ojo:</b> los derechos tuvieron límites: la participación política no siempre fue universal y las mujeres quedaron excluidas de la ciudadanía política plena.</p></div>`;

function geoTopic1(){head('🌍 Tema 1','De siervos a ciudadanos: crisis y revolución');app.innerHTML=`<div class="card"><b>Unidad 1</b><h2 style="margin:.3em 0">De siervos a ciudadanos: crisis y revolución</h2><p class="muted">Geografía e Historia · Material de clase</p></div><div class="tools"><button class="tool" onclick="geoShowSummary()">📖<br>Resumen</button><button class="tool" onclick="geoInfographic()">🎨<br>Infografía</button><button class="tool" onclick="geoWrittenTest()">✍️<br>Prueba escrita</button><button class="tool" onclick="geoTest()">✅<br>Test</button><button class="tool" onclick="geoQuick()">🧠<br>Repaso rápido</button><button class="tool" onclick="geoFlashcards()">🃏<br>Tarjetas</button><button class="tool" onclick="geoMistakes()">❌<br>Mis errores</button><button class="tool" onclick="geoPrepare()">🎯<br>Preparar examen</button></div><a class="wide" style="display:block;text-decoration:none" href="Apuntes_u1.pdf" target="_blank">📄 Ver apuntes originales</a>`}

function geoInfographic(){head('🎨 Infografía','Tema 1 · Cronología esencial');let events=[['1679','Habeas Corpus'],['1689','Bill of Rights'],['1701-1713','Guerra de Sucesión'],['1713','Paz de Utrecht'],['1773','Motín del Té'],['1776','Independencia de EE. UU.'],['1787','Constitución de EE. UU.'],['1789','Bastilla · inicio Revolución francesa'],['1791','Constitución francesa'],['1792','República'],['1793-1794','Jacobinos y Terror'],['1795','Directorio'],['1799','Golpe de Napoleón']];app.innerHTML=`<div class="card"><h2>Del absolutismo al liberalismo</h2><p><b>Antiguo Régimen</b> → Ilustración → parlamentarismo y revolución americana → Revolución francesa → liberalismo.</p></div>`+events.map(e=>`<div class="card" style="border-left:7px solid #10b981"><b style="font-size:22px">${e[0]}</b><div>${e[1]}</div></div>`).join('')+`<div class="card"><h3>Ideas que cambian</h3><p>Privilegios estamentales → <b>igualdad jurídica</b><br>Absolutismo → <b>soberanía nacional</b><br>Concentración del poder → <b>separación de poderes</b><br>Súbditos → <b>ciudadanos con derechos</b></p></div><button class="wide" onclick="geoTopic1()">← Volver al Tema 1</button>`}

function geoWrittenTest(){head('✍️ Prueba escrita','Tema 1 · Desarrollo');app.innerHTML=geoWritten.map((x,i)=>`<div class="card"><b>${i+1}. ${x[0]}</b><textarea id="w${i}" rows="4" style="width:100%;margin-top:10px;padding:10px;border:1px solid #cbd5e1;border-radius:10px" placeholder="Escribe tu respuesta..."></textarea><details><summary>Ver respuesta orientativa</summary><p>${x[1]}</p></details></div>`).join('')+`<div class="card"><b>Autoevaluación</b><p class="muted">Compara cada respuesta con la orientación de los apuntes. Cada pregunta vale 1 punto.</p></div><button class="wide" onclick="geoTopic1()">← Volver al Tema 1</button>`}
function geoQuick(){head('🧠 Repaso rápido','Tema 1 · Esenciales');let idx=0;function draw(){let c=geoCards[idx];app.innerHTML=`<div class="card" style="text-align:center;padding:30px"><div class="muted">Pregunta ${idx+1} de ${geoCards.length}</div><h2>${c[0]}</h2><button class="wide primary" onclick="document.getElementById('qa').classList.remove('hidden')">Mostrar respuesta</button><div id="qa" class="card hidden"><b>${c[1]}</b></div><div class="row"><button class="wide" onclick="geoQuick()">Reiniciar</button><button class="wide green" id="nextq">Siguiente →</button></div></div>`;document.getElementById('nextq').onclick=()=>{idx=(idx+1)%geoCards.length;draw()}}draw()}
function geoFlashcards(){head('🃏 Tarjetas','Tema 1 · 16 tarjetas');let i=0,show=false;function draw(){let c=geoCards[i];app.innerHTML=`<div class="card" style="min-height:280px;text-align:center;display:flex;flex-direction:column;justify-content:center" onclick="document.getElementById('fcans').classList.toggle('hidden')"><div class="muted">Tarjeta ${i+1}/${geoCards.length} · toca para girar</div><h2>${c[0]}</h2><div id="fcans" class="hidden"><hr><h2 style="color:#059669">${c[1]}</h2></div></div><div class="row"><button class="wide" id="prev">← Anterior</button><button class="wide green" id="next">Siguiente →</button></div>`;prev.onclick=()=>{i=(i-1+geoCards.length)%geoCards.length;draw()};next.onclick=()=>{i=(i+1)%geoCards.length;draw()}}draw()}
function geoMistakes(){head('❌ Mis errores','Tema 1');let m=JSON.parse(localStorage.getItem('d4_geo1_mistakes')||'[]');app.innerHTML=m.length?m.map((x,i)=>`<div class="card"><b>${i+1}. ${x.q}</b><details><summary>Ver respuesta correcta</summary><p>${x.a}</p></details></div>`).join('')+`<button class="wide" onclick="localStorage.removeItem('d4_geo1_mistakes');geoMistakes()">Limpiar errores</button>`:`<div class="empty"><div style="font-size:50px">🎉</div><h3>No hay errores guardados</h3><p>Los fallos del test aparecerán aquí.</p></div>`}
function geoPrepare(){head('🎯 Preparar examen','Tema 1');app.innerHTML=`<div class="card"><h2>Plan de estudio</h2><p>Completa los pasos en este orden:</p></div><button class="wide primary" onclick="geoShowSummary()">1️⃣ Leer el resumen</button><button class="wide" onclick="geoInfographic()">2️⃣ Memorizar cronología e ideas</button><button class="wide" onclick="geoFlashcards()">3️⃣ Practicar tarjetas</button><button class="wide orange" onclick="geoTest()">4️⃣ Hacer el test</button><button class="wide green" onclick="geoWrittenTest()">5️⃣ Prueba escrita final</button><button class="wide" onclick="geoMistakes()">6️⃣ Repasar mis errores</button>`}

function hub(){head('Agenda y Notas','Organiza el curso');app.innerHTML=`<button class="wide primary" onclick="agenda()">📅 Agenda · Próximos exámenes</button><button class="wide green" onclick="notes()">📊 Notas · Clasificación</button>`}
function agenda(){head('📅 Agenda','Todos los exámenes');renderCalendar()}
function renderCalendar(){let now=new Date(), y=now.getFullYear(),m=now.getMonth();let first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7;let h=`<div class="card"><h2>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h2><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${'<span></span>'.repeat(start)}`;for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,es=exams.filter(x=>x.d===ds);h+=`<div class="day ${d===now.getDate()&&m===now.getMonth()?'today':''}">${d}<div class="dots">${es.map(x=>`<i class="dot" style="background:${S[x.s].c}"></i>`).join('')}</div></div>`}h+=`</div></div><h3>Próximos exámenes</h3>`;let upcoming=exams.filter(x=>new Date(x.d+'T23:59')>=new Date()).sort((a,b)=>a.d.localeCompare(b.d));h+=upcoming.length?upcoming.map((x,i)=>`<div class="card"><b style="color:${S[x.s].c}">${S[x.s].e} ${S[x.s].n}</b><div><strong>${fmt(x.d)}</strong> · ${x.name||'Examen'}</div><div class="muted">${x.content||''}</div><button onclick="delExam('${x.id}')">Eliminar</button></div>`).join(''):`<div class="empty">No hay exámenes programados.</div>`;h+=`<button class="fab" onclick="examForm()">+</button>`;app.innerHTML=h}
function examForm(){modal(`<h2>Añadir examen</h2><select id="es">${Object.entries(S).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><input id="ed" type="date"><input id="en" placeholder="Nombre del examen"><textarea id="ec" placeholder="Temas o contenido"></textarea><button class="primary" onclick="addExam()">Guardar examen</button>`)} function addExam(){let d=ed.value;if(!d)return;exams.push({id:Date.now()+'',s:es.value,d,name:en.value,content:ec.value});save();closeM();renderCalendar()} function delExam(id){exams=exams.filter(x=>x.id!==id);save();renderCalendar()}
function notes(){head('📊 Notas','Mejores notas del curso');let sorted=[...grades].sort((a,b)=>b.score-a.score);app.innerHTML=`<div class="subjects">${Object.entries(S).map(([k,v])=>`<button class="chip" style="background:${v.c}" onclick="subjectGrades('${k}')">${v.e} ${v.n}</button>`).join('')}</div>${sorted.length?sorted.map((g,i)=>`<div class="card grade"><div class="medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1+'.'}</div><div><b>${S[g.s].n}</b><div>${g.name||'Prueba'} · ${fmt(g.d)}</div></div><div class="score">${num(g.score)}</div></div>`).join(''):`<div class="empty">Todavía no hay notas registradas.</div>`}<button class="fab" onclick="gradeForm()">+</button>`}
function gradeForm(pre=''){modal(`<h2>Añadir nota</h2><select id="gs">${Object.entries(S).map(([k,v])=>`<option ${k===pre?'selected':''} value="${k}">${v.n}</option>`).join('')}</select><input id="gd" type="date"><input id="gn" placeholder="Examen o prueba"><input id="gscore" type="number" min="0" max="10" step="0.01" placeholder="Nota (0-10)"><button class="primary" onclick="addGrade()">Guardar nota</button>`)} function addGrade(){let sc=parseFloat(gscore.value);if(!gd.value||isNaN(sc)||sc<0||sc>10)return;grades.push({id:Date.now()+'',s:gs.value,d:gd.value,name:gn.value,score:sc});save();closeM();notes()}
function subjectGrades(k){head('📊 '+S[k].n,'Notas de la asignatura');let a=grades.filter(g=>g.s===k).sort((x,y)=>y.d.localeCompare(x.d)),avg=a.length?a.reduce((z,g)=>z+g.score,0)/a.length:null;app.innerHTML=`<div class="card" style="text-align:center"><div class="muted">MEDIA ACTUAL</div><div class="avg">${avg===null?'—':num(avg)}</div></div>${a.length?a.map(g=>`<div class="card grade"><div><b>${g.name||'Prueba'}</b><div class="muted">${fmt(g.d)}</div></div><div class="score">${num(g.score)}</div></div>`).join(''):`<div class="empty">Sin notas todavía.</div>`}<button class="fab" onclick="gradeForm('${k}')">+</button>`}
function modal(x){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">${x}<button onclick="closeM()" style="margin-left:8px">Cancelar</button></div></div>`)}function closeM(){document.getElementById('modal')?.remove()}function fmt(d){return new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}function num(x){return Number(x).toLocaleString('es-ES',{maximumFractionDigits:2})}

let V={from:1,to:20,mode:1,cols:[1],answers:{}};function irregular(){head('🇬🇧 Verbos irregulares','Práctica integrada');app.innerHTML=`<div class="card"><div class="controls"><label>Desde <input id="vf" type="number" min="1" max="80" value="1" style="width:65px"></label><label>Hasta <input id="vt" type="number" min="1" max="80" value="20" style="width:65px"></label><button onclick="setRand(1)">Aleatorio 1</button><button onclick="setRand(2)">Aleatorio 2</button><button onclick="setRand(3)">Aleatorio 3</button><button onclick="startV()">Nueva práctica</button></div><p class="small muted">El rango siempre mantiene el orden. En modo aleatorio eliges cuántas respuestas escribir por verbo.</p></div><div id="varea"></div>`;startV()}
function setRand(n){V.mode=n;startV()}function startV(){if(document.getElementById('vf')){V.from=Math.max(1,+vf.value||1);V.to=Math.min(80,+vt.value||20)}if(V.from>V.to)[V.from,V.to]=[V.to,V.from];V.answers={};let rows=verbs.slice(V.from-1,V.to);let h=`<div class="card"><table class="verbtable"><thead><tr><th>#</th><th>Infinitive</th><th>Past</th><th>Participle</th><th>Español</th></tr></thead><tbody>`;rows.forEach((v,ri)=>{let need=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,V.mode);h+=`<tr><td>${V.from+ri}</td>${v.map((x,ci)=>`<td>${need.includes(ci)?`<input data-r="${ri}" data-c="${ci}" placeholder="?">`:`<b>${x}</b>`}</td>`).join('')}</tr>`});h+=`</tbody></table><div class="controls" style="margin-top:12px"><button class="sel" onclick="checkV()">Corregir</button><button onclick="showV()">Mostrar respuesta</button></div><h3 id="vscore"></h3></div>`;varea.innerHTML=h}
function norm(s){return s.trim().toLowerCase().replaceAll(' / ','/')}function checkV(){let ins=[...document.querySelectorAll('#varea input[data-r]')],ok=0;ins.forEach(i=>{let a=verbs[V.from-1+(+i.dataset.r)][+i.dataset.c];let good=norm(i.value)===norm(a);i.classList.remove('ok','bad');i.classList.add(good?'ok':'bad');if(good)ok++});vscore.textContent=`Resultado: ${ok}/${ins.length} · Nota: ${ins.length?num(ok/ins.length*10):10}/10`}
