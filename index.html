</style></head><body><header class="top"><div class="topin"><button id="back" class="back hidden" onclick="goHome()">←</button><div class="brand">📚</div><div><h1 id="title">Daniela 4º ESO</h1><p id="subtitle">Tu espacio de estudio</p></div></div></header><div id="installBar" class="installbar"><button id="installBtn" class="installbtn" onclick="installApp()">📲 Instalar Daniela 4º ESO</button><div id="installHint" class="installhint hidden"></div></div><main class="wrap" id="app"></main><script>

let deferredPrompt=null;const installBar=document.getElementById('installBar'),installBtn=document.getElementById('installBtn'),installHint=document.getElementById('installHint');
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function isiOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
function refreshInstall(){if(isStandalone()){installBar.classList.add('hidden');return}installBar.classList.remove('hidden');if(deferredPrompt){installBtn.textContent='📲 Instalar Daniela 4º ESO';installHint.classList.add('hidden')}else if(isiOS()){installBtn.textContent='📲 Cómo instalar en iPhone/iPad';}else{installBtn.textContent='📲 Instalar Daniela 4º ESO';}}

refreshInstall();
function save(){localStorage.setItem('d4_exams',JSON.stringify(exams));localStorage.setItem('d4_grades',JSON.stringify(grades))} function head(t,s=''){title.textContent=t;sub.textContent=s;back.classList.remove('hidden')} function goHome(){head('Daniela 4º ESO','Tu espacio de estudio');back.classList.add('hidden');home()}
function home(){app.innerHTML=`<div class="grid">${Object.entries(S).map(([k,v],i)=>`<button aria-label="${v.n}" class="tile ${['eng','math','ger','lat','len','geo'][i]}" onclick="subject('${k}')"></button>`).join('')}<button aria-label="Agenda y Notas" class="tile agenda" onclick="hub()"></button></div>`}
function nextExam(k){return exams.filter(x=>x.s===k&&new Date(x.d+'T23:59')>=new Date()).sort((a,b)=>a.d.localeCompare(b.d))[0]}
function subject(k){let v=S[k],n=nextExam(k);head(v.e+' '+v.n,'4º ESO');app.innerHTML=`<div class="card next"><b>📅 Próximo examen</b><div style="font-size:24px;font-weight:900;margin-top:6px">${n?fmt(n.d):'Sin fecha programada'}</div>${n?`<div>${n.name||'Examen'}</div>`:''}</div><button class="wide primary" onclick="topics('${k}')">📚 Temario</button><button class="wide" onclick="subjectGrades('${k}')">📊 Notas de ${v.n}</button>${k==='ingles'?`<button class="wide orange" onclick="irregular()">🇬🇧 Verbos irregulares</button>`:''}<button class="wide" onclick="resources('${k}')">📎 Recursos</button>`}

function hub(){head('Agenda y Notas','Organiza el curso');app.innerHTML=`<button class="wide primary" onclick="agenda()">📅 Agenda · Próximos exámenes</button><button class="wide green" onclick="notes()">📊 Notas · Clasificación</button>`}
function agenda(){head('📅 Agenda','Todos los exámenes');renderCalendar()}

function examForm(){modal(`<h2>Añadir examen</h2><select id="es">${Object.entries(S).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><input id="ed" type="date"><input id="en" placeholder="Nombre del examen"><textarea id="ec" placeholder="Temas o contenido"></textarea><button class="primary" onclick="addExam()">Guardar examen</button>`)} function addExam(){let d=ed.value;if(!d)return;exams.push({id:Date.now()+'',s:es.value,d,name:en.value,content:ec.value});save();closeM();renderCalendar()} function delExam(id){exams=exams.filter(x=>x.id!==id);save();renderCalendar()}
function notes(){head('📊 Notas','Mejores notas del curso');let sorted=[...grades].sort((a,b)=>b.score-a.score);app.innerHTML=`<div class="subjects">${Object.entries(S).map(([k,v])=>`<button class="chip" style="background:${v.c}" onclick="subjectGrades('${k}')">${v.e} ${v.n}</button>`).join('')}</div>${sorted.length?sorted.map((g,i)=>`<div class="card grade"><div class="medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1+'.'}</div><div><b>${S[g.s].n}</b><div>${g.name||'Prueba'} · ${fmt(g.d)}</div></div><div class="score">${num(g.score)}</div></div>`).join(''):`<div class="empty">Todavía no hay notas registradas.</div>`}<button class="fab" onclick="gradeForm()">+</button>`}
function gradeForm(pre=''){modal(`<h2>Añadir nota</h2><select id="gs">${Object.entries(S).map(([k,v])=>`<option ${k===pre?'selected':''} value="${k}">${v.n}</option>`).join('')}</select><input id="gd" type="date"><input id="gn" placeholder="Examen o prueba"><input id="gscore" type="number" min="0" max="10" step="0.01" placeholder="Nota (0-10)"><button class="primary" onclick="addGrade()">Guardar nota</button>`)} function addGrade(){let sc=parseFloat(gscore.value);if(!gd.value||isNaN(sc)||sc<0||sc>10)return;grades.push({id:Date.now()+'',s:gs.value,d:gd.value,name:gn.value,score:sc});save();closeM();notes()}
function subjectGrades(k){head('📊 '+S[k].n,'Notas de la asignatura');let a=grades.filter(g=>g.s===k).sort((x,y)=>y.d.localeCompare(x.d)),avg=a.length?a.reduce((z,g)=>z+g.score,0)/a.length:null;app.innerHTML=`<div class="card" style="text-align:center"><div class="muted">MEDIA ACTUAL</div><div class="avg">${avg===null?'—':num(avg)}</div></div>${a.length?a.map(g=>`<div class="card grade"><div><b>${g.name||'Prueba'}</b><div class="muted">${fmt(g.d)}</div></div><div class="score">${num(g.score)}</div></div>`).join(''):`<div class="empty">Sin notas todavía.</div>`}<button class="fab" onclick="gradeForm('${k}')">+</button>`}
function modal(x){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div class="sheet">${x}<button onclick="closeM()" style="margin-left:8px">Cancelar</button></div></div>`)}function closeM(){document.getElementById('modal')?.remove()}function fmt(d){return new Date(d+'T12:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'})}function num(x){return Number(x).toLocaleString('es-ES',{maximumFractionDigits:2})}
const verbs=[['be','was/were','been','ser/estar'],['become','became','become','convertirse'],['begin','began','begun','empezar'],['break','broke','broken','romper'],['bring','brought','brought','traer'],['build','built','built','construir'],['buy','bought','bought','comprar'],['catch','caught','caught','coger/atrapar'],['choose','chose','chosen','elegir'],['come','came','come','venir'],['cost','cost','cost','costar'],['cut','cut','cut','cortar'],['do','did','done','hacer'],['draw','drew','drawn','dibujar'],['drink','drank','drunk','beber'],['drive','drove','driven','conducir'],['eat','ate','eaten','comer'],['fall','fell','fallen','caer'],['feel','felt','felt','sentir'],['find','found','found','encontrar'],['fly','flew','flown','volar'],['forget','forgot','forgotten','olvidar'],['get','got','got','conseguir'],['give','gave','given','dar'],['go','went','gone','ir'],['fight','fought','fought','luchar'],['grow','grew','grown','crecer'],['have','had','had','tener'],['hear','heard','heard','oír'],['hide','hid','hidden','esconder'],['hit','hit','hit','golpear'],['hold','held','held','sostener'],['keep','kept','kept','guardar'],['know','knew','known','saber/conocer'],['learn','learnt','learnt','aprender'],['leave','left','left','dejar/salir'],['lend','lent','lent','prestar'],['lose','lost','lost','perder'],['make','made','made','hacer/fabricar'],['meet','met','met','conocer/reunirse'],['pay','paid','paid','pagar'],['put','put','put','poner'],['read','read','read','leer'],['ride','rode','ridden','montar'],['ring','rang','rung','sonar/llamar'],['run','ran','run','correr'],['say','said','said','decir'],['see','saw','seen','ver'],['sell','sold','sold','vender'],['send','sent','sent','enviar'],['sing','sang','sung','cantar'],['sit','sat','sat','sentarse'],['sleep','slept','slept','dormir'],['speak','spoke','spoken','hablar'],['spend','spent','spent','gastar/pasar'],['stand','stood','stood','estar de pie'],['steal','stole','stolen','robar'],['swim','swam','swum','nadar'],['take', let V={from:1,to:20,mode:1,cols:[1],answers:{}};function irregular(){head('🇬🇧 Verbos irregulares','Práctica integrada');app.innerHTML=`<div class="card"><div class="controls"><label>Desde <input id="vf" type="number" min="1" max="80" value="1" style="width:65px"></label><label>Hasta <input id="vt" type="number" min="1" max="80" value="20" style="width:65px"></label><button onclick="setRand(1)">Aleatorio 1</button><button onclick="setRand(2)">Aleatorio 2</button><button onclick="setRand(3)">Aleatorio 3</button><button onclick="startV()">Nueva práctica</button></div><p class="small muted">El rango siempre mantiene el orden. En modo aleatorio eliges cuántas respuestas escribir por verbo.</p></div><div id="varea"></div>`;startV()}
function setRand(n){V.mode=n;startV()}function startV(){if(document.getElementById('vf')){V.from=Math.max(1,+vf.value||1);V.to=Math.min(80,+vt.value||20)}if(V.from>V.to)[V.from,V.to]=[V.to,V.from];V.answers={};let rows=verbs.slice(V.from-1,V.to);let h=`<div class="card"><table class="verbtable"><thead><tr><th>#</th><th>Infinitive</th><th>Past</th><th>Participle</th><th>Español</th></tr></thead><tbody>`;rows.forEach((v,ri)=>{let need=[0,1,2,3].sort(()=>Math.random()-.5).slice(0,V.mode);h+=`<tr><td>${V.from+ri}</td>${v.map((x,ci)=>`<td>${need.includes(ci)?`<input data-r="${ri}" data-c="${ci}" placeholder="?">`:`<b>${x}</b>`}</td>`).join('')}</tr>`});h+=`</tbody></table><div class="controls" style="margin-top:12px"><button class="sel" onclick="checkV()">Corregir</button><button onclick="showV()">Mostrar respuesta</button></div><h3 id="vscore"></h3></div>`;varea.innerHTML=h}
function norm(s){return s.trim().toLowerCase().replaceAll(' / ','/')}function checkV(){let ins=[...document.querySelectorAll('#varea input[data-r]')],ok=0;ins.forEach(i=>{let a=verbs[V.from-1+(+i.dataset.r)][+i.dataset.c];let good=norm(i.value)===norm(a);i.classList.remove('ok','bad');i.classList.add(good?'ok':'bad');if(good)ok++});vscore.textContent=`Resultado: ${ok}/${ins.length} · Nota: ${ins.length?num(ok/ins.length*10):10}/10`}
