let exams=JSON.parse(localStorage.getItem('d4_exams')||'[]'), grades=JSON.parse(localStorage.getItem('d4_grades')||'[]');
const app=document.getElementById('app'), title=document.getElementById('title'), sub=document.getElementById('subtitle'), back=document.getElementById('back');
let deferredPrompt=null;const installBar=document.getElementById('installBar'),installBtn=document.getElementById('installBtn'),installHint=document.getElementById('installHint');

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;refreshInstall()});window.addEventListener('appinstalled',()=>{deferredPrompt=null;installBar.classList.add('hidden')});
async function installApp(){if(isStandalone()){installBar.classList.add('hidden');return}if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;refreshInstall();return}installHint.classList.remove('hidden');installHint.innerHTML=isiOS()?'<b>iPhone/iPad:</b> pulsa Compartir ⤴️ y después <b>Añadir a pantalla de inicio</b>.':'<b>Android/Chrome:</b> abre el menú ⋮ del navegador y pulsa <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>. Si acabas de actualizar la web, recárgala una vez.';}

const lenguaData={
'i':{tag:'1.I',title:'La lengua y sus hablantes. Conceptos lingüísticos',pdf:'Lengua_1_I_Conceptos_linguisticos.pdf',summary:`<h3>Ideas esenciales</h3><ul><li><b>Lenguaje:</b> capacidad biológica e innata del ser humano para crear mensajes complejos, abstractos, infinitos y creativos.</li><li><b>Lengua:</b> sistema abstracto de comunicación verbal propio de una comunidad humana, generalmente con escritura.</li><li><b>Dialecto:</b> variedad de una lengua vinculada a una zona; no es una forma incorrecta ni incompleta. El español de Canarias es una variedad dialectal del español.</li><li><b>Habla:</b> uso individual y concreto que una persona hace de la lengua en una situación determinada.</li><li><b>Bilingüismo:</b> uso habitual de dos lenguas por una persona o comunidad, con igual prestigio social e institucional.</li><li><b>Diglosia:</b> convivencia desigual: una lengua o variedad se reserva para ámbitos formales y otra queda relegada a usos informales.</li></ul><p><b>Atención:</b> las preguntas de los recuadros del material son especialmente importantes porque el profesor indica que aparecerán idénticas o parecidas en las pruebas.</p>`,qs:[['¿Cuál es la diferencia fundamental entre lengua y habla?','La lengua es el sistema abstracto compartido; el habla es su realización individual y concreta.'],['¿Es un dialecto una lengua mal hablada?','No. Es una variedad de una lengua en una zona o comunidad.'],['¿Qué diferencia hay entre bilingüismo y diglosia?','En el bilingüismo las lenguas poseen el mismo prestigio; en la diglosia existe una distribución desigual y jerárquica de usos.']]},
'ii':{tag:'1.II',title:'Comunicación. Texto, contexto y situación',pdf:'Lengua_1_II_Texto_contexto_situacion.pdf',summary:`<h3>Ideas esenciales</h3><ul><li><b>Texto:</b> unidad total de comunicación; puede ser un enunciado o un conjunto coherente de enunciados, oral o escrito.</li><li>Un texto debe tener <b>coherencia</b> y <b>cohesión</b>.</li><li><b>Contexto lingüístico:</b> palabras y expresiones que rodean un elemento y permiten determinar su sentido.</li><li><b>Situación o contexto extralingüístico:</b> entorno físico, social y temporal: quién habla, a quién, dónde, cuándo y con qué intención.</li><li>El significado real puede ser <b>literal o implícito</b>; la situación permite interpretar peticiones indirectas, ironías y presuposiciones.</li></ul><p>El material trabaja estas ideas mediante numerosos ejemplos de palabras polisémicas y situaciones comunicativas.</p>`,qs:[['¿Qué diferencia hay entre contexto y situación?','El contexto es lingüístico; la situación incluye las circunstancias externas de la comunicación.'],['¿Por qué «¿Tienes hora?» suele interpretarse como una petición?','Porque la situación permite entender que se pide que indiquen qué hora es, no una respuesta literal de sí/no.'],['¿Qué ocurre en una ironía?','Se dice algo cuyo sentido literal no coincide con la intención real, que se recupera gracias a la situación.']]},
'iv':{tag:'1.IV',title:'Literatura del siglo XVIII',pdf:'Lengua_1_IV_Literatura_siglo_XVIII.pdf',summary:`<h3>Panorama esencial</h3><ul><li>La <b>Ilustración</b> confía en la razón, la ciencia y la educación para mejorar la sociedad.</li><li>La literatura ilustrada busca claridad, equilibrio y <b>utilidad educativa y moral</b>: «enseñar deleitando».</li><li>El <b>Neoclasicismo</b> recupera modelos clásicos, sencillez, armonía, verosimilitud y respeto a las reglas.</li><li>Destaca la <b>prosa de ideas y el ensayo</b>. Feijoo combate errores, supersticiones y prejuicios; Cadalso utiliza la literatura epistolar para observar críticamente la sociedad.</li><li>La <b>fábula</b> tiene finalidad moral: Tomás de Iriarte y Félix María de Samaniego.</li><li>En teatro destaca <b>Leandro Fernández de Moratín</b> y <i>El sí de las niñas</i>, crítica de los matrimonios impuestos.</li><li>En Canarias sobresale <b>José de Viera y Clavijo</b>, junto a Tomás de Iriarte, José Clavijo y Fajardo y Cristóbal del Hoyo.</li><li>Al final del siglo aparecen rasgos <b>prerrománticos</b>: sensibilidad, subjetividad, melancolía y emociones intensas.</li></ul>`,qs:[['¿Qué finalidad tiene la literatura ilustrada?','Educar y mejorar la sociedad, transmitiendo conocimientos y corrigiendo costumbres.'],['¿Cuál es la estética principal de la segunda mitad del XVIII?','El Neoclasicismo.'],['¿Quién escribió El sí de las niñas y qué critica?','Leandro Fernández de Moratín; critica los matrimonios impuestos y defiende una educación que permita decidir a las jóvenes.']]}}

const courseData={
 mates:{title:'Tema 1 · Estadística',hero:'mates.jpg',blocks:[
  {id:'m1',t:'1. Estudios estadísticos',sum:`<h2>Estudios estadísticos</h2><p>La estadística estudia datos para describir una población y obtener conclusiones. Hay que distinguir <b>población</b>, <b>muestra</b>, <b>individuo</b> y <b>variable estadística</b>. Las variables pueden ser cualitativas o cuantitativas; estas últimas, discretas o continuas.</p><p>Los datos se organizan en tablas de frecuencias: frecuencia absoluta, relativa y sus acumuladas. Una muestra debe ser representativa para que las conclusiones sean útiles.</p>`},
  {id:'m2',t:'2. Gráficos estadísticos',sum:`<h2>Gráficos estadísticos</h2><p>Los datos pueden representarse mediante diagramas adecuados al tipo de variable: barras, sectores, histogramas y otros gráficos estadísticos. El objetivo es visualizar distribución, frecuencia y comparación de los datos sin perder la información de la tabla.</p>`},
  {id:'m3',t:'3. Centralización y posición',sum:`<h2>Medidas de centralización y posición</h2><p>Las medidas de centralización resumen dónde se concentra un conjunto de datos: <b>media, mediana y moda</b>. Las medidas de posición permiten localizar valores dentro de la distribución, como cuartiles y percentiles.</p><div class="formula">Media = suma de valores / número de datos</div>`},
  {id:'m4',t:'4. Dispersión',sum:`<h2>Medidas de dispersión</h2><p>Indican cuánto se separan los datos entre sí y respecto a los valores centrales. Se estudian medidas como el <b>rango, varianza y desviación típica</b>, útiles para comparar la homogeneidad de diferentes distribuciones.</p>`},
  {id:'m5',t:'5. Variables bidimensionales',sum:`<h2>Variables estadísticas bidimensionales</h2><p>Se estudian dos variables a la vez para observar si existe relación entre ellas. Los pares de datos se pueden representar y analizar para describir la posible asociación entre ambas variables.</p>`}
 ],files:[['Teoría · UD1 Estadística','4MMA_UD1_TH_ESTADÍSTICA.pdf'],['Ejercicios · UD1 Estadística','4MMA_UD1_EJERCICIOS 1.pdf']]},
 latin:{title:'Tema 1 · Latín',hero:'latin.jpg',blocks:[
  {id:'l1',t:'1. Lengua latina y origen',sum:`<h2>Lengua latina y origen</h2><p>El material parte del <b>indoeuropeo</b> y sitúa el latín dentro de esa familia lingüística. Desde el latín se explica la evolución hacia las lenguas romances.</p>`},
  {id:'l2',t:'2. Gramática y traducción',sum:`<h2>Gramática y traducción</h2><p>La <b>1.ª declinación</b> trabaja seis casos: nominativo (sujeto/atributo), vocativo (apelación), acusativo (CD o CC), genitivo (CN), dativo (CI) y ablativo (CC). Sus terminaciones permiten reconocer número y función.</p><p>También se practican el verbo <b>sum</b>, presente e imperfecto, conjugaciones regulares, análisis morfológico y sintáctico y traducción de oraciones.</p>`},
  {id:'l3',t:'3. Latín práctico',sum:`<h2>Latín práctico</h2><p>Reúne vocabulario, presentación personal, <i>Loquimur Latine</i>, diálogos, construcción de oraciones y textos de primera declinación. La práctica consiste en reconocer formas, comprender vocabulario y traducir del latín al español.</p>`},
  {id:'l4',t:'4. Roma: historia y cultura',sum:`<h2>Roma: historia y cultura</h2><p>La Monarquía romana se sitúa entre <b>753 y 509 a. C.</b>. Se estudian los siete reyes, los poderes del rey, Rómulo, Tarquinio el Soberbio, Lucrecia, la caída de la Monarquía y el inicio de la República, además de los libros sibilinos.</p>`}

 ingles:{title:'Tema 1 · Inglés',hero:'ingles.jpg',blocks:[
  {id:'e1',t:'1. Present Simple / Present Continuous',sum:`<h2>Present Simple vs Present Continuous</h2><p><b>Present Simple</b>: hábitos y rutinas; se asocia a expresiones como <i>always, every day, often, sometimes, usually, never</i>. <b>Present Continuous</b>: acciones en progreso o situaciones temporales; usa <i>now, right now, at the moment, today, this morning/afternoon/evening</i>.</p><p>Se practica la formación en <b>-ing</b>, afirmativa, negativa e interrogativa y la atención a <b>stative verbs</b>.</p>`},
  {id:'e2',t:'2. Modal verbs',sum:`<h2>Modal verbs · present and past</h2><p>El material contrasta capacidad/permiso, obligación, ausencia de obligación y prohibición: <b>can/can’t, could/couldn’t, have to/must, had to, don’t have to/didn’t have to, mustn’t</b>. También se emplean para pedir y dar consejo.</p>`},
  {id:'e3',t:'3. Past tenses y used to',sum:`<h2>Past Simple, Past Continuous y used to</h2><p><b>Past Simple</b> expresa acciones terminadas; <b>Past Continuous</b>, acciones en progreso en un momento del pasado; <b>used to</b>, hábitos o estados pasados que ya no son actuales.</p>`},
  {id:'e4',t:'4. Present Perfect / Past Simple',sum:`<h2>Present Perfect vs Past Simple</h2><p>El material compara experiencias o acciones conectadas con el presente con acciones terminadas en un momento pasado concreto. Trabaja expresiones como <i>ever, never, just, since, yet, yesterday, last...</i> y exige conocer el <b>past participle</b>.</p>`},
  {id:'e5',t:'5. Future tense review',sum:`<h2>Future tense review</h2><p>Se repasan distintas formas de futuro según su uso: <b>will</b> para predicciones, decisiones espontáneas o promesas; <b>be going to</b> para intenciones; presente continuo para planes; presente simple para horarios; y <b>might</b> para posibilidad.</p>`},
  {id:'e6',t:'6. Vocabulary',sum:`<h2>Vocabulary</h2><p>El Tema 1 reúne vocabulario de <b>health and well-being</b>, <b>personal qualities</b>, <b>extreme adjectives</b> y <b>learning techniques</b>. Incluye expresiones como <i>chill out, work out, keep fit, take care of yourself, spend time outdoors</i> y vocabulario para describir cualidades y formas de estudiar.</p>`},
  {id:'e7',t:'7. 80 irregular verbs',sum:`<h2>80 irregular verbs</h2><p>Lista oficial de estudio con <b>infinitive + past simple + past participle + español</b>. Este bloque enlaza con la práctica interactiva ya integrada en la aplicación.</p><button class="wide orange" onclick="irregular()">🎮 Practicar los 80 verbos</button>`}
 ],files:[['80 irregular verbs','80_irregular_verbs_past_simple.docx.pdf'],['Present Simple / Continuous','present-simple-continuous.pdf'],['Workbook We Belong 4','WORKBOOK WEBELONG 4.pdf'],['Student’s Book We Belong 4','Students book we belong 4.pdf']]}
};

function renderCalendar(){let now=new Date(), y=now.getFullYear(),m=now.getMonth();let first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7;let h=`<div class="card"><h2>${first.toLocaleDateString('es-ES',{month:'long',year:'numeric'})}</h2><div class="calendar">${['L','M','X','J','V','S','D'].map(x=>`<b>${x}</b>`).join('')}${'<span></span>'.repeat(start)}`;for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,es=exams.filter(x=>x.d===ds);h+=`<div class="day ${d===now.getDate()&&m===now.getMonth()?'today':''}">${d}<div class="dots">${es.map(x=>`<i class="dot" style="background:${S[x.s].c}"></i>`).join('')}</div></div>`}h+=`</div></div><h3>Próximos exámenes</h3>`;let upcoming=exams.filter(x=>new Date(x.d+'T23:59')>=new Date()).sort((a,b)=>a.d.localeCompare(b.d));h+=upcoming.length?upcoming.map((x,i)=>`<div class="card"><b style="color:${S[x.s].c}">${S[x.s].e} ${S[x.s].n}</b><div><strong>${fmt(x.d)}</strong> · ${x.name||'Examen'}</div><div class="muted">${x.content||''}</div><button onclick="delExam('${x.id}')">Eliminar</button></div>`).join(''):`<div class="empty">No hay exámenes programados.</div>`;h+=`<button class="fab" onclick="examForm()">+</button>`;app.innerHTML=h}
function examForm(){modal(`<h2>Añadir examen</h2><select id="es">${Object.entries(S).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('')}</select><input id="ed" type="date"><input id="en" placeholder="Nombre del examen"><textarea id="ec" placeholder="Temas o contenido"></textarea><button class="primary" onclick="addExam()">Guardar examen</button>`)} function addExam(){let d=ed.value;if(!d)return;exams.push({id:Date.now()+'',s:es.value,d,name:en.value,content:ec.value});save();closeM();renderCalendar()} function delExam(id){exams=exams.filter(x=>x.id!==id);save();renderCalendar()}

function renderNotes(){let sorted=[...grades].filter(g=>gradeFilter==='all'||g.s===gradeFilter).sort((a,b)=>b.score-a.score);let filters=`<div class="grade-filters"><button class="grade-filter ${gradeFilter==='all'?'active':''}" onclick="gradeFilter='all';renderNotes()">🏆 Todas</button>${Object.entries(S).map(([k,v])=>`<button class="grade-filter ${gradeFilter===k?'active':''}" style="background:${v.c}22;border-color:${gradeFilter===k?v.c:'transparent'}" onclick="gradeFilter='${k}';renderNotes()">${v.e} ${v.n}</button>`).join('')}</div>`;app.innerHTML=`<div class="notes-banner" role="img" aria-label="Daniela estudiando"></div><h2>🏆 Clasificación de notas</h2><p class="muted">Exámenes de mayor a menor</p>${filters}${sorted.length?sorted.map((g,i)=>`<div class="card grade grade-row ${g.score>=8?'high':g.score>=5?'pass':'fail'}"><div class="medal">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1+'.'}</div><div><b>${S[g.s]?.n||g.s}</b><div>${g.name||'Prueba'} · ${fmt(g.d)}</div></div>${scoreBox(g)}<div class="grade-actions" style="display:flex;flex-direction:column;gap:4px;flex:0 0 auto"><button aria-label="Editar nota" onclick="editGrade('${g.id}')">✏️</button><button aria-label="Eliminar nota" onclick="deleteGrade('${g.id}')">🗑️</button></div></div>`).join(''):`<div class="empty">Todavía no hay notas registradas para este filtro.</div>`}<button class="fab" onclick="gradeForm()">+</button>`}
function gradeForm(pre=''){modal(`<h2>Añadir nota</h2><select id="gs">${Object.entries(S).map(([k,v])=>`<option ${k===pre?'selected':''} value="${k}">${v.n}</option>`).join('')}</select><input id="gd" type="date"><input id="gn" placeholder="Examen o prueba"><input id="gscore" type="number" min="0" max="10" step="0.01" placeholder="Nota (0-10)"><button class="primary" onclick="addGrade()">Guardar nota</button>`)} function addGrade(){let sc=parseFloat(gscore.value);if(!gd.value||isNaN(sc)||sc<0||sc>10)return;grades.push({id:Date.now()+'',s:gs.value,d:gd.value,name:gn.value,score:sc});save();closeM();notes()}
function editGrade(id){
 const g=grades.find(x=>String(x.id)===String(id));if(!g)return;
 const esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;');
 modal(`<h2>Editar nota</h2><select id="egs">${Object.entries(S).map(([k,v])=>`<option value="${k}" ${k===g.s?'selected':''}>${v.n}</option>`).join('')}</select><input id="egd" type="date" value="${esc(g.d)}"><input id="egn" placeholder="Examen o prueba" value="${esc(g.name)}"><input id="egscore" type="number" min="0" max="10" step="0.01" value="${Number(g.score)}"><button class="primary" onclick="saveEditedGrade('${id}')">Guardar cambios</button>`)
}
function saveEditedGrade(id){const g=grades.find(x=>String(x.id)===String(id));if(!g)return;const sc=Number(document.getElementById('egscore').value);if(!document.getElementById('egd').value||!Number.isFinite(sc)||sc<0||sc>10){alert('Introduce una fecha y una nota entre 0 y 10.');return}g.s=document.getElementById('egs').value;g.d=document.getElementById('egd').value;g.name=document.getElementById('egn').value;g.score=sc;save();closeM();renderNotes()}

const V12_GEO_SUM=`<h1>De siervos a ciudadanos: crisis y revolución</h1><p class="v12-small">Geografía e Historia · Tema 1 · Resumen desarrollado a partir de los apuntes</p>
<h2>1. El Antiguo Régimen</h2><p>Era el sistema político, económico y social predominante en la Europa del siglo XVIII. Sus tres pilares eran la <b>agricultura tradicional de subsistencia</b>, la <b>sociedad estamental</b> y la <b>monarquía absoluta</b>.</p><div class="v12-diagram"><div>🌾 Economía<br>Agricultura</div><div>👥 Sociedad<br>Estamentos</div><div>👑 Política<br>Absolutismo</div></div>
<h3>Economía agraria</h3><p>La agricultura utilizaba métodos tradicionales, tenía rendimientos bajos y se destinaba sobre todo al autoconsumo. Las malas cosechas empeoraban la alimentación y la capacidad de pagar rentas.</p><h3>Sociedad estamental</h3><table><tr><th>Privilegiados</th><th>No privilegiados: Tercer Estado</th></tr><tr><td>Nobleza: propiedades, exenciones fiscales y tribunales especiales. Clero: tierras, diezmo (10 % de la cosecha) y altos cargos eclesiásticos.</td><td>Campesinos, artesanos, comerciantes y burgueses. Pagaban rentas e impuestos; la burguesía reclamaba mayor participación política.</td></tr></table><div class="v12-highlight"><b>Idea clave:</b> los privilegios dependían del estamento al que se pertenecía, no de la igualdad ante la ley.</div>
<h2>2. La Ilustración y el despotismo ilustrado</h2><p>La <b>Ilustración</b> fue un movimiento intelectual del siglo XVIII que defendía la razón y la observación frente a la tradición y la superstición. La <b>Enciclopedia</b>, dirigida por Diderot y D'Alembert, difundió conocimientos y recibió críticas y censura de la monarquía y la Iglesia.</p><p>Algunos monarcas introdujeron reformas en agricultura, comercio, administración, ciencia y educación, pero sin renunciar al absolutismo ni suprimir los privilegios. Este modelo se llamó <b>despotismo ilustrado</b>.</p><div class="v12-highlight"><b>«Todo para el pueblo, pero sin el pueblo»:</b> reformas desde el poder, sin participación política de la población.</div>
<h2>3. El parlamentarismo</h2><p>Inglaterra y los Países Bajos desarrollaron sistemas políticos alternativos al absolutismo. El Parlamento intervenía en las leyes y el control del gobierno, y se establecían límites al poder.</p><table><tr><th>Documento inglés</th><th>Importancia</th></tr><tr><td><b>Habeas Corpus (1679)</b></td><td>Protección de libertades individuales.</td></tr><tr><td><b>Bill of Rights (1689)</b></td><td>Limitación del poder real y mayor control parlamentario.</td></tr></table>
<h2>4. La independencia de Estados Unidos</h2><p>Las trece colonias británicas se enfrentaron a Gran Bretaña por tensiones políticas y económicas. Tras el <b>Motín del Té de Boston (1773)</b>, la guerra comenzó en <b>1775</b>. Los colonos declararon su independencia el <b>4 de julio de 1776</b>; Gran Bretaña la reconoció en <b>1783</b>.</p><p>Estados Unidos aprobó su <b>Constitución en 1787</b> y George Washington fue elegido presidente en <b>1789</b>. El proceso influyó en otras revoluciones liberales.</p>
<h2>5. La Guerra de Sucesión española</h2><p>En <b>1700</b>, Carlos II murió sin descendencia. Felipe de Anjou, proclamado <b>Felipe V</b>, y Carlos de Habsburgo disputaron la sucesión. Fue un conflicto <b>internacional</b>, por el equilibrio entre las potencias europeas, y también <b>interno</b>: Castilla apoyó mayoritariamente a Felipe, mientras buena parte de la Corona de Aragón respaldó a Carlos por sus instituciones y fueros.</p><p>La <b>Paz de Utrecht (1713)</b> reconoció a Felipe V como rey y reforzó la posición de Gran Bretaña.</p>
<h2>6. La Revolución francesa (1789-1799)</h2><h3>Las causas</h3><p>El Tercer Estado sufría desigualdades; la burguesía tenía riqueza pero poco poder; las malas cosechas agravaban la pobreza; la monarquía acumulaba deudas y los privilegiados se resistían a pagar nuevos impuestos. Las ideas ilustradas y el ejemplo estadounidense impulsaron demandas de libertad, igualdad y soberanía nacional.</p><h3>1789: el comienzo</h3><p>Luis XVI convocó los <b>Estados Generales</b>. Los representantes del Tercer Estado se proclamaron <b>Asamblea Nacional</b> y prometieron elaborar una Constitución. El <b>14 de julio de 1789</b>, el pueblo asaltó la Bastilla. En el campo también hubo revueltas contra los señores.</p><h3>La monarquía constitucional</h3><p>Se abolieron privilegios señoriales y se aprobó la <b>Declaración de los Derechos del Hombre y del Ciudadano</b>. La <b>Constitución de 1791</b> estableció soberanía nacional, separación de poderes e igualdad ante la ley, pero el sufragio era <b>censitario</b> y el rey conservaba el poder ejecutivo y capacidad de veto. Se impulsó la libertad económica y se expropiaron bienes de la Iglesia.</p><h3>La República (1792)</h3><p>El intento de huida de Luis XVI y la guerra contra Austria y Prusia desacreditaron al rey. Los <b>sans-culottes</b> impulsaron la insurrección de agosto de 1792. Se suspendió la monarquía y se proclamó la República. Los <b>girondinos</b> eran moderados y los <b>jacobinos</b>, más radicales.</p><h3>Los jacobinos y el Terror (1793-1794)</h3><p>Luis XVI fue ejecutado en <b>1793</b>. Los jacobinos, encabezados por <b>Robespierre</b>, impulsaron medidas sociales, como precios máximos y regulación de salarios, pero también recurrieron a una dura represión política conocida como el <b>Terror</b>.</p><h3>El Directorio (1795-1799)</h3><p>Robespierre cayó en <b>1794</b>. En <b>1795</b> se instauró un gobierno de cinco miembros, el <b>Directorio</b>, que abandonó las medidas sociales más radicales. La inestabilidad y las guerras aumentaron la influencia del ejército.</p>
<h2>7. Napoleón y las consecuencias</h2><p>En <b>1799</b>, Napoleón Bonaparte dio un golpe de Estado, puso fin al Directorio y estableció el Consulado. Mantuvo conquistas como la igualdad jurídica y la propiedad privada, pero concentró el poder. En <b>1804</b> se proclamó emperador.</p><p>La Revolución contribuyó al fin de los privilegios estamentales y difundió la soberanía nacional, las constituciones, la separación de poderes y las libertades. No obstante, muchos derechos seguían limitados y las mujeres estaban excluidas de la ciudadanía política plena.</p>
<div class="v12-highlight"><b>Fechas esenciales:</b> 1700 (sucesión española), 1713 (Utrecht), 1776 (independencia estadounidense), 1789 (Revolución francesa), 1791 (Constitución), 1792 (República), 1793-1794 (Terror), 1795-1799 (Directorio), 1799 (Napoleón), 1804 (emperador).</div>`;
const V12_MATH=`<h1>Tema 1 · Estadística</h1><p class="v12-small">Matemáticas A · Ejemplos didácticos elaborados para explicar los conceptos de los apuntes</p>
<h2>1. Estudios estadísticos</h2><p>La <b>población</b> es el conjunto de elementos estudiados y una <b>muestra</b> es una parte de esa población. Una <b>variable estadística</b> es la característica que se observa; puede ser cualitativa o cuantitativa, y esta última puede ser discreta o continua.</p><div class="v12-example"><b>Ejemplo:</b> queremos estudiar las horas de estudio semanales de 200 estudiantes. Los 200 forman la población; si encuestamos a 40, son una muestra. Las horas son una variable cuantitativa.</div>
<h2>2. Tablas de frecuencias</h2><p>La <b>frecuencia absoluta (fᵢ)</b> indica cuántas veces aparece un dato. La <b>frecuencia relativa (hᵢ)</b> es fᵢ/n y se puede expresar en porcentaje. También se calculan frecuencias acumuladas.</p><div class="v12-example"><b>Ejemplo resuelto:</b> notas 5, 6, 6, 8, 10 (n = 5).<table><tr><th>Nota</th><th>fᵢ</th><th>hᵢ</th><th>F acumulada</th></tr><tr><td>5</td><td>1</td><td>20 %</td><td>1</td></tr><tr><td>6</td><td>2</td><td>40 %</td><td>3</td></tr><tr><td>8</td><td>1</td><td>20 %</td><td>4</td></tr><tr><td>10</td><td>1</td><td>20 %</td><td>5</td></tr></table><p>La nota 6 tiene frecuencia relativa 2/5 = 0,4 = <b>40 %</b>.</p><svg viewBox="0 0 320 180" role="img" aria-label="Diagrama de barras de las frecuencias de las notas"><path d="M35 12V145H305" fill="none" stroke="#284a70" stroke-width="2"/><g fill="#2987df"><rect x="55" y="85" width="38" height="60" rx="4"/><rect x="112" y="25" width="38" height="120" rx="4"/><rect x="169" y="85" width="38" height="60" rx="4"/><rect x="226" y="85" width="38" height="60" rx="4"/></g><g fill="#143c67" font-size="13" text-anchor="middle"><text x="74" y="163">5</text><text x="131" y="163">6</text><text x="188" y="163">8</text><text x="245" y="163">10</text><text x="74" y="78">1</text><text x="131" y="19">2</text><text x="188" y="78">1</text><text x="245" y="78">1</text></g></svg></div>
<h2>3. Gráficos estadísticos</h2><p>El <b>diagrama de barras</b> representa frecuencias mediante barras separadas; el <b>histograma</b> utiliza rectángulos contiguos para intervalos; el <b>diagrama de sectores</b> reparte los 360° del círculo proporcionalmente; el <b>polígono de frecuencias</b> une los puntos representativos de las frecuencias.</p><div class="v12-example"><b>Ejemplo de sectores:</b> si el 40 % del alumnado elige una actividad, su sector mide 0,40 × 360° = <b>144°</b>.<svg viewBox="0 0 320 145" role="img" aria-label="Gráfico de sectores: 40 por ciento y 60 por ciento"><circle cx="95" cy="72" r="56" fill="#b2e6ca"/><path d="M95 72 L95 16 A56 56 0 0 1 128 117 Z" fill="#318de0"/><text x="185" y="60" font-size="16" fill="#2162a1">■ 40 %</text><text x="185" y="90" font-size="16" fill="#207c55">■ 60 %</text></svg></div>
<h2>4. Medidas de centralización</h2><p><b>Media aritmética:</b> suma de valores dividida por el número de datos. <b>Moda:</b> valor más frecuente. <b>Mediana:</b> valor central después de ordenar los datos.</p><div class="v12-example"><b>Ejemplo:</b> 5, 6, 6, 8, 10. <b>Media</b> = (5+6+6+8+10)/5 = 35/5 = <b>7</b>. <b>Moda</b> = 6. <b>Mediana</b> = 6, porque es el tercer valor de los cinco ordenados.</div>
<h2>5. Medidas de posición</h2><p>Los <b>cuartiles</b> dividen los datos ordenados en cuatro partes; los <b>deciles</b>, en diez; y los <b>percentiles</b>, en cien. El <b>diagrama de caja y bigotes</b> permite visualizar mediana, cuartiles y extremos.</p><div class="v12-example"><b>Ejemplo gráfico:</b> en los datos ordenados 2, 4, 6, 8, 10, 12, 14, la mediana es 8; Q₁ = 4 y Q₃ = 12 (tomando las mitades sin incluir la mediana).<svg viewBox="0 0 320 120" role="img" aria-label="Diagrama de caja y bigotes de 2 a 14, cuartiles 4 y 12, mediana 8"><line x1="30" y1="55" x2="290" y2="55" stroke="#225ca4" stroke-width="3"/><rect x="73" y="29" width="174" height="52" fill="#d9eaff" stroke="#225ca4" stroke-width="3"/><line x1="160" y1="29" x2="160" y2="81" stroke="#df5d5d" stroke-width="4"/><line x1="30" y1="39" x2="30" y2="71" stroke="#225ca4" stroke-width="3"/><line x1="290" y1="39" x2="290" y2="71" stroke="#225ca4" stroke-width="3"/><g font-size="13" fill="#143c67" text-anchor="middle"><text x="30" y="102">2</text><text x="73" y="102">Q₁=4</text><text x="160" y="102">Me=8</text><text x="247" y="102">Q₃=12</text><text x="290" y="117">14</text></g></svg></div>
<h2>6. Medidas de dispersión</h2><p>El <b>rango</b> es el máximo menos el mínimo. La <b>desviación media</b> promedia las distancias absolutas respecto a la media. La <b>varianza</b> promedia los cuadrados de las desviaciones y la <b>desviación típica</b> es su raíz cuadrada. El <b>coeficiente de variación</b> compara la dispersión relativa.</p><div class="v12-example"><b>Ejemplo:</b> datos 2, 4, 6. Media = 4; rango = 6−2 = <b>4</b>; varianza = [(2−4)²+(4−4)²+(6−4)²]/3 = 8/3 ≈ <b>2,67</b>; desviación típica = √(8/3) ≈ <b>1,63</b>. Cuanto mayor es la desviación típica, más dispersos están los datos.</div>
<h2>7. Estadística bidimensional</h2><p>Se estudian <b>dos variables</b> a la vez mediante pares de datos (x, y). El <b>diagrama de dispersión</b> representa cada pareja como un punto. Una nube ascendente indica asociación positiva; descendente, negativa; y sin patrón definido, asociación débil o nula.</p><div class="v12-example"><b>Ejemplo:</b> horas de estudio (1, 2, 3, 4, 5) y puntuaciones (3, 4, 6, 7, 9).<svg viewBox="0 0 320 180" role="img" aria-label="Diagrama de dispersión ascendente entre horas de estudio y notas"><path d="M35 10V145H305" fill="none" stroke="#284a70" stroke-width="2"/><g fill="#e85e92" stroke="white" stroke-width="2"><circle cx="75" cy="110" r="7"/><circle cx="120" cy="96" r="7"/><circle cx="165" cy="68" r="7"/><circle cx="210" cy="54" r="7"/><circle cx="255" cy="26" r="7"/></g><text x="140" y="174" fill="#143c67" font-size="13">Horas de estudio →</text><text x="42" y="18" fill="#143c67" font-size="12">Nota ↑</text></svg><p><b>Interpretación:</b> en este ejemplo, al aumentar las horas de estudio también aumentan las notas. La asociación no demuestra por sí sola causalidad.</p></div>`;

function v12Escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function v12Qs(k){let original=k==='geo'?geoCards:k==='lengua'?Object.values(lenguaData).flatMap(d=>d.qs):bank[k]||[];return [...original,...(V12_EXTRA[k]||[])].filter(x=>x&&x.length===2)}
function v12Written(k,title,qs){head('✍️ Prueba escrita',title);let items=qs.filter((_,i)=>i%2===0).slice(0,9);app.innerHTML=`<div class="card v12-written"><h2>✍️ Prueba escrita</h2><p>Escribe tus respuestas sin consultar los apuntes. Al terminar, compáralas con la respuesta modelo.</p>${items.map((q,i)=>`<div class="v12-q"><b>${i+1}. ${v12Escape(q[0])}</b><textarea aria-label="Respuesta a la pregunta ${i+1}" placeholder="Escribe aquí tu respuesta..."></textarea><details><summary>Comprobar respuesta modelo</summary><p>${v12Escape(q[1])}</p></details></div>`).join('')}<p class="v12-small">Autoevaluación orientativa: compara tu respuesta con los conceptos esenciales. No se realiza corrección automática de texto libre.</p></div>`}
function v12Quick(k,title,qs){head('⚡ Repaso rápido',title);let items=qs.filter((_,i)=>i%2===1).concat(V12_EXTRA[k]||[]);if(!items.length)items=qs;let i=0;function draw(){let q=items[i];app.innerHTML=`<div class="card" style="text-align:center"><p class="v12-counter">${i+1} / ${items.length}</p><h2>${v12Escape(q[0])}</h2><button class="wide primary" id="v12reveal">Ver respuesta breve</button><div class="v12-highlight hidden" id="v12quickanswer">${v12Escape(q[1])}</div><div class="v12-row"><button id="v12qprev">← Anterior</button><button id="v12qnext">Siguiente →</button></div></div>`;document.getElementById('v12reveal').onclick=()=>document.getElementById('v12quickanswer').classList.remove('hidden');document.getElementById('v12qprev').onclick=()=>{i=(i-1+items.length)%items.length;draw()};document.getElementById('v12qnext').onclick=()=>{i=(i+1)%items.length;draw()}}draw()}
function v12Cards(k,title,qs){head('🃏 Tarjetas de estudio',title);let items=qs.length?qs:V12_EXTRA[k]||[];let i=0,flipped=false;function draw(){let q=items[i];app.innerHTML=`<div class="v12-counter">Tarjeta ${i+1} de ${items.length}</div><div class="v12-cardstage"><div class="v12-flip ${flipped?'flipped':''}" id="v12flip" tabindex="0" role="button" aria-label="Voltear tarjeta"><div class="v12-face"><div class="v12-art" style="background-image:url('${V12ART[k]||'geo.jpg'}')"></div><div class="v12-cardtext"><span>❓ PREGUNTA</span><h3>${v12Escape(q[0])}</h3><div class="v12-cardfoot">Toca para girar ↻</div></div></div><div class="v12-face back"><div class="v12-art" style="background-image:url('${V12ART[k]||'geo.jpg'}')"></div><div class="v12-cardtext"><span>✅ RESPUESTA</span><p>${v12Escape(q[1])}</p><div class="v12-cardfoot">Toca para volver ↻</div></div></div></div></div><div class="v12-row"><button id="v12cprev">← Anterior</button><button id="v12cnext" class="primary">Siguiente →</button></div>`;let f=document.getElementById('v12flip');f.onclick=()=>{flipped=!flipped;f.classList.toggle('flipped',flipped)};f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f.click()}};document.getElementById('v12cprev').onclick=()=>{i=(i-1+items.length)%items.length;flipped=false;draw()};document.getElementById('v12cnext').onclick=()=>{i=(i+1)%items.length;flipped=false;draw()}}draw()}
function v12Test(k,title,qs){head('✅ Test · 3 opciones',title);let pool=qs.filter(x=>x[1].length<170),extra=V12_EXTRA[k]||[];pool=[...extra,...pool];let seen=new Set();pool=pool.filter(x=>{if(seen.has(x[0]))return false;seen.add(x[0]);return true});let items=pool.slice(0,12).map((q,i)=>{let other=pool.filter(x=>x[1]!==q[1]&&x[1].length<140).map(x=>x[1]);let choices=[q[1],other[(i+1)%other.length]||'Ninguna de las anteriores',other[(i+4)%other.length]||'Todas las anteriores'];if(choices[1]===choices[2])choices[2]='No se puede determinar con esos datos';let rot=i%3;choices=choices.slice(rot).concat(choices.slice(0,rot));return {q:q[0],a:q[1],opts:choices}});let selected={};app.innerHTML=`<div class="card"><h2>Test de ${title}</h2><p>Elige una de las tres respuestas. Cada pregunta tiene una única opción correcta.</p>${items.map((q,i)=>`<div class="v12-q" id="v12t${i}"><b>${i+1}. ${v12Escape(q.q)}</b>${q.opts.map((o,j)=>`<button class="v12-opt" data-i="${i}" data-j="${j}">${'ABC'[j]}. ${v12Escape(o)}</button>`).join('')}<div class="v12-small" id="v12ex${i}"></div></div>`).join('')}<button class="wide primary" id="v12grade">Corregir test</button><div id="v12score"></div></div>`;document.querySelectorAll('.v12-opt').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;selected[i]=+b.dataset.j;document.querySelectorAll(`#v12t${i} .v12-opt`).forEach(x=>x.classList.toggle('chosen',x===b))});document.getElementById('v12grade').onclick=()=>{let score=0,wrong=[];items.forEach((q,i)=>{let ix=q.opts.indexOf(q.a),s=selected[i];if(s===ix)score++;else wrong.push({q:q.q,a:q.a});document.querySelectorAll(`#v12t${i} .v12-opt`).forEach((b,j)=>{b.disabled=true;b.classList.toggle('good',j===ix);b.classList.toggle('bad',j===s&&s!==ix)});document.getElementById('v12ex'+i).textContent=s===ix?'✓ Correcto':'Respuesta correcta: '+q.a});let key='d4_v12_mistakes_'+k;localStorage.setItem(key,JSON.stringify(wrong));document.getElementById('v12score').innerHTML=`<div class="v12-testresult"><h2>Resultado: ${score}/${items.length} · ${Math.round(score/items.length*100)} %</h2><p>${wrong.length} preguntas para repasar en Mis errores.</p></div>`;document.getElementById('v12grade').disabled=true;document.getElementById('v12score').scrollIntoView({behavior:'smooth',block:'nearest'})}}
function v12Mistakes(k,title){head('❌ Mis errores',title);let arr=JSON.parse(localStorage.getItem('d4_v12_mistakes_'+k)||'[]');app.innerHTML=arr.length?`<div class="card"><h2>Errores del último test</h2>${arr.map((q,i)=>`<div class="v12-q"><b>${i+1}. ${v12Escape(q.q)}</b><details><summary>Ver respuesta</summary><p>${v12Escape(q.a)}</p></details></div>`).join('')}<button class="wide" id="v12clear">Limpiar errores</button></div>`:`<div class="empty"><h3>🎉 No hay errores del último test</h3><p>Los fallos del test se guardarán aquí.</p></div>`;let b=document.getElementById('v12clear');if(b)b.onclick=()=>{localStorage.removeItem('d4_v12_mistakes_'+k);v12Mistakes(k,title)}}
function v12Prepare(k,title,qs){head('🎯 Preparar examen',title);let items=k==='geo'?V12_GEO_PREP:k==='mates'?V12_MATH_PREP:qs.filter((_,i)=>i%2===0).slice(0,10);app.innerHTML=`<div class="card"><h2>🎯 Preguntas para preparar el examen</h2><p>Estudia cada respuesta modelo y después intenta explicarla sin mirarla. Se han usado los contenidos del material aportado.</p>${items.map((q,i)=>`<div class="v12-q"><b>${i+1}. ${v12Escape(q[0])}</b><details><summary>Ver respuesta modelo</summary><p>${v12Escape(q[1])}</p></details></div>`).join('')}</div>`}

const V12_EXT_LATIN = {'l1':`<section class="v12-section"><h2>Del indoeuropeo al latín</h2><p>El <b>indoeuropeo</b> es la familia lingüística a la que pertenece el latín. A partir del latín hablado en diferentes territorios del Imperio romano se desarrollaron las <b>lenguas romances</b>. Entre ellas se encuentran el español, el portugués, el francés, el italiano, el catalán y el rumano.</p><div class="v12-highlight"><b>Para distinguir:</b> latín es la lengua de origen; las lenguas romances son lenguas que evolucionaron a partir de ella. No todas las lenguas europeas son romances.</div><div class="v12-example"><b>✏️ Ejemplo explicado</b><p>El español <i>luna</i> y el italiano <i>luna</i> muestran una semejanza que se explica por su origen latino. El parecido no significa que sean el mismo idioma.</p></div></section>`,'l2':`<section class="v12-section"><h2>Morfología: la primera declinación</h2><p>En latín, la terminación de un nombre indica su <b>caso</b>, su <b>número</b> y, por tanto, su función dentro de la oración. Los apuntes trabajan la <b>primera declinación</b>, que suele incluir sustantivos femeninos, aunque también hay masculinos.</p><table><tr><th>Caso</th><th>Singular</th><th>Plural</th><th>Función habitual</th></tr><tr><td>Nominativo</td><td>-a</td><td>-ae</td><td>Sujeto / atributo</td></tr><tr><td>Vocativo</td><td>-a</td><td>-ae</td><td>Llamada o apelación</td></tr><tr><td>Acusativo</td><td>-am</td><td>-as</td><td>Complemento directo; también ciertos CC</td></tr><tr><td>Genitivo</td><td>-ae</td><td>-arum</td><td>Complemento del nombre</td></tr><tr><td>Dativo</td><td>-ae</td><td>-is</td><td>Complemento indirecto</td></tr><tr><td>Ablativo</td><td>-a</td><td>-is</td><td>Complemento circunstancial</td></tr></table><div class="v12-highlight"><b>Atención:</b> el nominativo plural y el genitivo/dativo singular terminan en <b>-ae</b>. Para reconocer el caso hay que analizar la función y el contexto, no solo la terminación.</div><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>Puella rosam portat.</i> → «La niña lleva una rosa». <b>Puella</b> es nominativo singular y sujeto; <b>rosam</b> es acusativo singular y complemento directo.</p></div><section class="v12-section"><h2>Cómo analizar y traducir una oración</h2><p>1. Localiza el verbo y determina persona y número. 2. Busca el nominativo que pueda ser sujeto. 3. Identifica los complementos según sus casos. 4. Traduce de forma natural al español, respetando el significado.</p><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>Puellae rosas portant.</i> → «Las niñas llevan rosas». <b>Puellae</b>: nominativo plural; <b>rosas</b>: acusativo plural; <b>portant</b>: tercera persona plural.</p></div></section></section>`,'l3':`<section class="v12-section"><h2>El verbo latino y la comunicación</h2><p>En las actividades de morfología y traducción se estudia el verbo <b>sum</b> («ser/estar») y la conjugación de verbos regulares en <b>presente</b> e <b>imperfecto</b>. Es importante reconocer las desinencias personales y distinguir el tiempo verbal.</p><table><tr><th>SUM</th><th>Presente</th><th>Imperfecto</th></tr><tr><td>1.ª singular</td><td>sum</td><td>eram</td></tr><tr><td>2.ª singular</td><td>es</td><td>eras</td></tr><tr><td>3.ª singular</td><td>est</td><td>erat</td></tr><tr><td>1.ª plural</td><td>sumus</td><td>eramus</td></tr><tr><td>2.ª plural</td><td>estis</td><td>eratis</td></tr><tr><td>3.ª plural</td><td>sunt</td><td>erant</td></tr></table><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>Puella est laeta.</i> → «La niña está contenta». <i>Puella erat laeta.</i> → «La niña estaba contenta». Cambia el tiempo verbal, no el sujeto.</p></div><p>El material de <b>Loquimur Latine</b> y las fichas de presentación incluyen saludos, diálogos, vocabulario, números del <b>1 al 20</b> y construcción de oraciones. Conviene practicar tanto la comprensión como la traducción, sin memorizar únicamente listas aisladas.</p><div class="v12-highlight"><b>Método de estudio:</b> leer el diálogo, localizar las palabras conocidas, identificar las terminaciones y traducir la frase completa.</div></section>`,'l4':`<section class="v12-section"><h2>La monarquía romana (753–509 a. C.)</h2><p>La tradición sitúa la fundación de Roma en <b>753 a. C.</b> y el final de la Monarquía en <b>509 a. C.</b>. Durante esta etapa Roma estuvo gobernada por reyes. El material trabaja sus poderes, los siete reyes y los episodios relacionados con la caída de la monarquía.</p><table><tr><th>Orden</th><th>Rey</th></tr><tr><td>1</td><td>Rómulo</td></tr><tr><td>2</td><td>Numa Pompilio</td></tr><tr><td>3</td><td>Tulio Hostilio</td></tr><tr><td>4</td><td>Anco Marcio</td></tr><tr><td>5</td><td>Tarquinio Prisco</td></tr><tr><td>6</td><td>Servio Tulio</td></tr><tr><td>7</td><td>Tarquinio el Soberbio</td></tr></table><p>El relato de <b>Lucrecia</b> y el rechazo a los abusos de <b>Tarquinio el Soberbio</b> se vinculan tradicionalmente con el fin de la monarquía. Para el examen interesa situar correctamente el período, reconocer a los reyes y explicar por qué terminó.</p><div class="v12-highlight"><b>Fechas clave:</b> 753 a. C. → fundación tradicional de Roma; 509 a. C. → fin de la monarquía.</div></section>`};
const V12_EXT_INGLES = {'e1':`<section class="v12-section"><h2>Present Simple: rutinas y hechos habituales</h2><p>El <b>Present Simple</b> se usa para hábitos, rutinas y hechos generales. En afirmativa se emplea el verbo base, pero en <b>he / she / it</b> se añade normalmente <b>-s</b> o <b>-es</b>. En negativas e interrogativas se usan <b>do / does</b>.</p><table><tr><th>Tipo</th><th>Ejemplo</th></tr><tr><td>Afirmativa</td><td>She plays tennis every Saturday.</td></tr><tr><td>Negativa</td><td>She does not (doesn’t) play tennis.</td></tr><tr><td>Pregunta</td><td>Does she play tennis?</td></tr></table><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>Daniela studies English every day.</i> → es una rutina; por eso se usa <b>studies</b>. Con <i>does</i>, el verbo principal vuelve a su forma base: <i>Does Daniela study?</i></p></div><section class="v12-section"><h2>Present Continuous: acciones en progreso</h2><p>Se forma con <b>am / is / are + verbo-ing</b> y se usa para acciones que están ocurriendo ahora o en torno al momento presente.</p><table><tr><th>Uso</th><th>Ejemplo</th></tr><tr><td>Afirmativa</td><td>They are studying now.</td></tr><tr><td>Negativa</td><td>He isn’t sleeping.</td></tr><tr><td>Pregunta</td><td>Are you listening?</td></tr></table><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>I usually walk to school, but today I am taking the bus.</i> → <b>walk</b> describe el hábito; <b>am taking</b> describe la situación actual.</p></div><div class="v12-highlight"><b>Ortografía -ing:</b> <i>make → making</i> (desaparece la e final); <i>run → running</i> (se duplica la consonante en ciertos casos); <i>lie → lying</i> (ie → y).</div></section></section>`,'e2':`<section class="v12-section"><h2>Modal verbs: capacidad, obligación y prohibición</h2><p>Los <b>verbos modales</b> expresan posibilidad, capacidad, permiso u obligación. Normalmente van seguidos de un verbo en forma base, sin <i>to</i>.</p><table><tr><th>Expresión</th><th>Uso</th><th>Ejemplo</th></tr><tr><td>can / can’t</td><td>Capacidad o permiso / incapacidad o prohibición según contexto</td><td>I can swim.</td></tr><tr><td>could / couldn’t</td><td>Capacidad en el pasado</td><td>I could read at six.</td></tr><tr><td>must / have to</td><td>Obligación</td><td>You must wear a helmet.</td></tr><tr><td>had to</td><td>Obligación pasada</td><td>We had to leave early.</td></tr><tr><td>don’t have to</td><td>No es necesario</td><td>You don’t have to come.</td></tr><tr><td>mustn’t</td><td>Está prohibido</td><td>You mustn’t smoke here.</td></tr><tr><td>didn’t have to</td><td>No fue necesario</td><td>She didn’t have to wait.</td></tr></table><div class="v12-highlight"><b>No confundas:</b> <i>mustn’t</i> = prohibición; <i>don’t have to</i> = ausencia de obligación.</div><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>You mustn’t use your phone in the exam.</i> → está prohibido. <i>You don’t have to bring a dictionary.</i> → no es obligatorio llevarlo.</p></div></section>`,'e3':`<section class="v12-section"><h2>Past Simple y Past Continuous</h2><p>El <b>Past Simple</b> expresa acciones terminadas en el pasado: <i>yesterday, last week, two days ago</i>. En verbos regulares se añade <b>-ed</b>; los irregulares tienen formas propias. Las preguntas y negativas suelen llevar <b>did + verbo base</b>.</p><p>El <b>Past Continuous</b> expresa una acción que estaba ocurriendo en un momento del pasado. Se forma con <b>was / were + -ing</b>.</p><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>I was doing my homework when the phone rang.</i> → la acción larga o en progreso es <b>was doing</b>; el hecho puntual que la interrumpe es <b>rang</b>.</p></div><table><tr><th>Past Simple</th><th>Past Continuous</th></tr><tr><td>She watched a film.</td><td>She was watching a film.</td></tr><tr><td>Acción pasada terminada</td><td>Acción en desarrollo en el pasado</td></tr></table><section class="v12-section"><h2>Used to</h2><p><b>Used to + infinitive</b> describe hábitos o situaciones habituales del pasado que ya no son así.</p><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>I used to play football every afternoon.</i> → «Antes solía jugar al fútbol todas las tardes».</p></div></section></section>`,'e4':`<section class="v12-section"><h2>Present Perfect y Past Simple</h2><p>El <b>Present Perfect</b> se forma con <b>have / has + past participle</b>. En los ejercicios se utiliza para experiencias y acciones que mantienen relación con el presente. Aparecen expresiones como <i>ever, never, just, already, yet, for, since</i>.</p><p>El <b>Past Simple</b> se utiliza cuando se sitúa la acción en un momento pasado terminado, como <i>yesterday</i> o <i>last year</i>.</p><table><tr><th>Present Perfect</th><th>Past Simple</th></tr><tr><td>I have visited London.</td><td>I visited London in 2022.</td></tr><tr><td>Experiencia sin fecha pasada concreta</td><td>Acción en un momento pasado definido</td></tr></table><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>Have you ever eaten sushi?</i> pregunta por una experiencia. <i>Did you eat sushi yesterday?</i> pregunta por una ocasión concreta.</p></div><div class="v12-highlight"><b>Irregulares:</b> el Present Perfect usa la <b>tercera columna</b> de la lista: <i>go – went – gone</i>; <i>see – saw – seen</i>.</div></section>`,'e5':`<section class="v12-section"><h2>Formas de expresar el futuro</h2><p>Los materiales repasan distintas formas de futuro y su uso. La elección depende de lo que se quiere comunicar: una predicción, una intención o un plan organizado.</p><table><tr><th>Forma</th><th>Uso trabajado</th><th>Ejemplo</th></tr><tr><td>will + verbo</td><td>Predicción, promesa o decisión espontánea</td><td>I will help you.</td></tr><tr><td>be going to + verbo</td><td>Intención o plan</td><td>I am going to study tonight.</td></tr><tr><td>Present Continuous</td><td>Plan futuro organizado</td><td>We are meeting on Friday.</td></tr></table><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>The phone is ringing. I’ll answer it.</i> → decisión espontánea. <i>I’m going to revise this afternoon.</i> → intención previa.</p></div><div class="v12-highlight"><b>Clave:</b> no basta con reconocer una palabra de tiempo; hay que interpretar si es una decisión inmediata, una intención o un plan.</div></section>`,'e6':`<section class="v12-section"><h2>Vocabulario del tema</h2><p>El material de <i>We Belong 4</i> trabaja los campos de <b>health and well-being</b> (salud y bienestar), <b>personal qualities</b> (cualidades personales), <b>extreme adjectives</b> (adjetivos intensos) y <b>learning techniques</b> (técnicas de aprendizaje).</p><table><tr><th>Bloque</th><th>Expresión del material</th><th>Sentido</th></tr><tr><td>Salud y bienestar</td><td>keep fit</td><td>mantenerse en forma</td></tr><tr><td>Salud y bienestar</td><td>work out</td><td>hacer ejercicio</td></tr><tr><td>Bienestar</td><td>chill out</td><td>relajarse</td></tr></table><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>I work out to keep fit.</i> → «Hago ejercicio para mantenerme en forma». El vocabulario se recuerda mejor si se utiliza en frases completas.</p></div><div class="v12-highlight">Para completar el vocabulario, consulta las actividades y listas exactas del <b>Student’s Book</b> y el <b>Workbook</b>; el resumen no sustituye sus ejercicios.</div></section>`,'e7':`<section class="v12-section"><h2>Los 80 verbos irregulares</h2><p>La ficha de clase contiene <b>80 verbos irregulares</b> con infinitivo, pasado simple, participio pasado y traducción al español. Se estudian las cuatro columnas, no solo el pasado simple.</p><table><tr><th>Infinitive</th><th>Past Simple</th><th>Past Participle</th><th>Español</th></tr><tr><td>be</td><td>was / were</td><td>been</td><td>ser / estar</td></tr><tr><td>go</td><td>went</td><td>gone</td><td>ir</td></tr><tr><td>see</td><td>saw</td><td>seen</td><td>ver</td></tr><tr><td>write</td><td>wrote</td><td>written</td><td>escribir</td></tr><tr><td>eat</td><td>ate</td><td>eaten</td><td>comer</td></tr></table><div class="v12-example"><b>✏️ Ejemplo explicado</b><p><i>Yesterday I went to school.</i> → Past Simple (<b>went</b>). <i>I have gone home.</i> → Present Perfect (<b>gone</b>).</p></div><div class="v12-highlight">Estos son ejemplos para entender las columnas. La <b>lista completa de 80 verbos</b> y la práctica interactiva siguen disponibles en la aplicación.</div></section>`};
const V12_EXT_LENGUA = {'i':`<section class="v12-section"><h2>Lenguaje, lengua, dialecto y habla</h2><p>El <b>lenguaje</b> es la capacidad humana, biológica e innata, de comunicar ideas mediante signos. Permite crear mensajes nuevos, abstractos y complejos. La <b>lengua</b> es el sistema compartido por una comunidad: sus palabras y reglas. El <b>habla</b> es el uso individual de ese sistema en una situación concreta.</p><table><tr><th>Concepto</th><th>Definición</th><th>Ejemplo del material</th></tr><tr><td>Lenguaje</td><td>Capacidad humana de comunicación</td><td>Poder contar una historia inventada</td></tr><tr><td>Lengua</td><td>Sistema compartido de signos y reglas</td><td>El español</td></tr><tr><td>Dialecto</td><td>Variedad territorial de una lengua</td><td>Español de Canarias</td></tr><tr><td>Habla</td><td>Realización individual de la lengua</td><td>Una nota de voz concreta</td></tr></table><div class="v12-example"><b>✏️ Ejemplo explicado</b><p>Decir <i>guagua</i> o <i>fleje</i> en Canarias no es hablar incorrectamente: son usos propios de una variedad dialectal del español.</p></div><section class="v12-section"><h2>Lengua y dialecto no son categorías de calidad</h2><p>Los dialectos no son versiones defectuosas de una lengua. Las diferencias de pronunciación y vocabulario dependen de la región y de la comunidad. Los apuntes mencionan el <b>seseo</b>, la <b>aspiración</b> y el vocabulario canario.</p><p>La <b>Lengua de Signos Española</b> posee estructura gramatical y léxico propios; el <b>Silbo Gomero</b> es un sistema que permite transmitir elementos del español mediante silbidos, no una lengua independiente.</p></section></section><section class="v12-section"><h2>Bilingüismo y diglosia</h2><p>El <b>bilingüismo</b> es el uso habitual de dos lenguas por una persona o comunidad. Los apuntes presentan como referencia la convivencia de lenguas con igual prestigio social e institucional. La <b>diglosia</b> aparece cuando las variedades o lenguas conviven con una distribución desigual de prestigio y usos: una predomina en ámbitos formales y otra queda relegada a contextos informales.</p><div class="v12-example"><b>✏️ Ejemplo explicado</b><p>Si dos lenguas se usan en señalización e instituciones con el mismo estatus, el ejemplo representa bilingüismo institucional; si una se considera adecuada para trámites y otra solo para el hogar, ilustra una situación diglósica.</p></div><div class="v12-highlight"><b>Importante para el examen:</b> los apuntes señalan expresamente que las preguntas de los recuadros pueden aparecer idénticas o parecidas en las pruebas. Esas preguntas se trabajan en «Preparar examen».</div></section>`,'ii':`<section class="v12-section"><h2>El texto como unidad de comunicación</h2><p>Un <b>texto</b> es una unidad de comunicación que puede ser oral o escrita, breve o extensa. Para interpretarlo no basta con identificar las palabras: hay que relacionarlas entre sí y con la situación en la que se emiten.</p><p>La <b>coherencia</b> permite que el contenido tenga sentido global. La <b>cohesión</b> conecta las partes del texto mediante recursos lingüísticos.</p><section class="v12-section"><h2>Contexto lingüístico y situación</h2><p>El <b>contexto lingüístico</b> son las palabras y expresiones que rodean un término y ayudan a interpretarlo. La <b>situación</b> incluye las circunstancias externas: quién habla, a quién, dónde, cuándo y con qué intención.</p><table><tr><th>Mismo término</th><th>Contexto</th><th>Sentido</th></tr><tr><td>bote</td><td>«Navegamos en un bote»</td><td>Embarcación</td></tr><tr><td>bote</td><td>«Un bote de cristal»</td><td>Recipiente</td></tr><tr><td>bote</td><td>«El balón dio un bote»</td><td>Salto o rebote</td></tr></table><div class="v12-example"><b>✏️ Ejemplo explicado</b><p>Si alguien pregunta «¿Tienes hora?» en la calle, normalmente solicita saber qué hora es; no espera simplemente «sí» o «no». La <b>intención</b> se interpreta gracias a la situación.</p></div></section><section class="v12-section"><h2>Lo literal y lo implícito</h2><p>Un mensaje puede transmitir más información de la que expresa literalmente. Las <b>presuposiciones</b>, las peticiones indirectas y la <b>ironía</b> dependen del contexto y de la situación comunicativa.</p><div class="v12-example"><b>✏️ Ejemplo explicado</b><p>«Menuda fiesta me has organizado» puede ser un agradecimiento sincero o una crítica irónica. El tono y lo que haya ocurrido permiten decidir su sentido.</p></div><div class="v12-highlight">En los ejercicios de los apuntes se comparan distintos significados de <i>fuego, estación, capital, mañana, llave</i> y otras palabras según su contexto.</div></section></section>`,'iv':`<section class="v12-section"><h2>El siglo XVIII: contexto histórico y cultural</h2><p>El siglo XVIII está marcado por la <b>Ilustración</b>, que confía en la razón, la ciencia y la educación para transformar la sociedad. En España, la muerte de Carlos II en 1700 desencadenó la Guerra de Sucesión y el acceso de los <b>Borbones</b> al trono con Felipe V.</p><p>El <b>despotismo ilustrado</b> impulsó reformas económicas, administrativas y educativas sin renunciar al poder de la monarquía: «todo para el pueblo, pero sin el pueblo». En 1713 se fundó la <b>Real Academia Española</b>. La Revolución francesa de <b>1789</b> marcó un cambio decisivo al final del siglo.</p><section class="v12-section"><h2>La literatura ilustrada y el Neoclasicismo</h2><p>La literatura ilustrada pretende ser <b>clara, equilibrada y útil</b>. Busca «enseñar deleitando»: transmitir conocimientos, corregir costumbres y combatir la ignorancia. El <b>Neoclasicismo</b> recupera modelos clásicos y defiende sencillez, armonía, verosimilitud y respeto a las reglas.</p><table><tr><th>Tendencia</th><th>Rasgos</th></tr><tr><td>Ilustración</td><td>Razón, conocimiento, progreso, finalidad educativa</td></tr><tr><td>Neoclasicismo</td><td>Orden, equilibrio, modelos clásicos, reglas y verosimilitud</td></tr><tr><td>Prerromanticismo</td><td>Mayor sensibilidad, subjetividad y emoción al final del siglo</td></tr></table></section><section class="v12-section"><h2>Géneros, autores y obras</h2><p>La <b>prosa de ideas</b> y el <b>ensayo</b> permiten reflexionar sobre educación, ciencia y sociedad. <b>Benito Jerónimo Feijoo</b> combate prejuicios y supersticiones en <i>Teatro crítico universal</i> y <i>Cartas eruditas y curiosas</i>.</p><p><b>José Cadalso</b> emplea la literatura epistolar en <i>Cartas marruecas</i>: el intercambio de cartas sirve para observar y criticar las costumbres españolas desde diferentes puntos de vista.</p><p>Las <b>fábulas</b> transmiten enseñanzas morales. Destacan <b>Tomás de Iriarte</b> y <b>Félix María de Samaniego</b>. En teatro, <b>Leandro Fernández de Moratín</b> escribió <i>El sí de las niñas</i>, obra que critica los matrimonios impuestos.</p><p>En Canarias destaca <b>José de Viera y Clavijo</b>; los apuntes también mencionan a Tomás de Iriarte, José Clavijo y Fajardo y Cristóbal del Hoyo.</p><div class="v12-highlight"><b>Relaciona siempre autor, obra y propósito:</b> Feijoo → ensayo crítico; Cadalso → cartas y crítica social; Iriarte → fábulas; Moratín → teatro y crítica de costumbres.</div></section><section class="v12-section"><h2>Etapas históricas y culturales</h2><p>Los materiales sitúan la literatura del siglo XVIII dentro de una secuencia cultural más amplia: <b>Edad Media, Edad Moderna y Edad Contemporánea</b>. La Ilustración y el Neoclasicismo corresponden al siglo XVIII; el Romanticismo se desarrolla posteriormente, durante el XIX.</p></section></section>`};
function v12ExtCourse(k){let c=courseData[k];let content=k==='latin'?V12_EXT_LATIN:V12_EXT_INGLES;return '<h1>'+c.title+'</h1>'+c.blocks.map(b=>content[b.id]||b.sum).join('')}
courseSummary=function(k){let c=courseData[k];v12Summary(c.title,k==='mates'?V12_MATH:v12ExtCourse(k),`courseWhole('${k}')`)};
courseBlockSummary=function(id){let [k,c,b]=findBlock(id);let ext=k==='latin'?V12_EXT_LATIN:k==='ingles'?V12_EXT_INGLES:{};v12Summary(b.t,ext[b.id]||b.sum,`courseBlock('${id}')`)};
lenguaSummary=function(id){let d=lenguaData[id];v12Summary(d.tag+' · '+d.title,'<h1>'+d.title+'</h1>'+(V12_EXT_LENGUA[id]||d.summary),`lenguaEpigraph('${id}')`)};
