<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1697px" version="1.1" viewBox="0 0 1200 1697" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="1697" width="1200" x="0" y="0" /><rect fill="#ed455d" height="280" width="1200" x="0" y="0" /><circle cx="30" cy="15" fill="#ffc948" opacity="0.45" r="6" /><circle cx="113" cy="56" fill="#ffc948" opacity="0.45" r="9" /><circle cx="196" cy="97" fill="#ffc948" opacity="0.45" r="12" /><circle cx="279" cy="138" fill="#ffc948" opacity="0.45" r="15" /><circle cx="362" cy="179" fill="#ffc948" opacity="0.45" r="6" /><circle cx="445" cy="220" fill="#ffc948" opacity="0.45" r="9" /><circle cx="528" cy="261" fill="#ffc948" opacity="0.45" r="12" /><circle cx="611" cy="37" fill="#ffc948" opacity="0.45" r="15" /><circle cx="694" cy="78" fill="#ffc948" opacity="0.45" r="6" /><circle cx="777" cy="119" fill="#ffc948" opacity="0.45" r="9" /><circle cx="860" cy="160" fill="#ffc948" opacity="0.45" r="12" /><circle cx="943" cy="201" fill="#ffc948" opacity="0.45" r="15" /><circle cx="1026" cy="242" fill="#ffc948" opacity="0.45" r="6" /><circle cx="1109" cy="18" fill="#ffc948" opacity="0.45" r="9" /><circle cx="1192" cy="59" fill="#ffc948" opacity="0.45" r="12" /><circle cx="75" cy="100" fill="#ffc948" opacity="0.45" r="15" /><circle cx="158" cy="141" fill="#ffc948" opacity="0.45" r="6" /><circle cx="241" cy="182" fill="#ffc948" opacity="0.45" r="9" /><rect fill="#ffffff" height="208" opacity="0.13" rx="30" width="770" x="42" y="34" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="49" font-weight="bold" x="65" y="112">INGLÉS</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="bold" x="68" y="165">TEMA 1 · GRAMMAR &amp; VOCABULARY</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="normal" x="68" y="212">INFOGRAFÍA ILUSTRADA · 4.º ESO · TEMA 1</text><g transform="translate(972,54)"><ellipse cx="70" cy="140" fill="#1675d2" rx="75" ry="47" /><path d="M16 120 Q-2 48 29 11 Q73 -23 113 13 Q151 49 125 126 L110 143 L33 143 Z" fill="#643b29" stroke="#3c2421" stroke-width="3" /><ellipse cx="72" cy="70" fill="#ffd0a6" rx="49" ry="60" stroke="#9d6249" stroke-width="2" /><path d="M23 49 Q32 -10 75 9 Q109 4 121 53 Q87 30 65 27 Q40 42 23 49" fill="#613421" /><circle cx="52" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="52" cy="75" fill="#142b48" r="4" /><circle cx="93" cy="74" fill="none" r="19" stroke="#15264e" stroke-width="5" /><circle cx="93" cy="75" fill="#142b48" r="4" /><line stroke="#15264e" stroke-linecap="round" stroke-width="4" x1="71" x2="74" y1="74" y2="74" /><path d="M58 104 Q74 119 91 102" fill="none" stroke="#ad4e5b" stroke-linecap="round" stroke-width="4" /><path d="M20 148 Q73 118 123 150" fill="none" stroke="#09539b" stroke-width="5" /></g><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="bold" x="1042" y="258">DANIELA</text><rect fill="#fff0f3" height="411" rx="25" stroke="#ed455d" stroke-width="2.5" width="550" x="35" y="306" /><rect fill="#ed455d" height="80" rx="24" width="550" x="35" y="306" /><rect fill="#ed455d" height="30" width="550" x="35" y="356" /><circle cx="78" cy="346" fill="#ffc948" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="355">01</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="355">PRESENT SIMPLE</text><text fill="#ed455d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="423">Routines · facts · habits</text><g fill="none" opacity="0.13" stroke="#ed455d" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,436) scale(0.85)"><circle cx="60" cy="40" r="38" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="60" x2="60" y1="40" y2="15" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="60" x2="81" y1="40" y2="52" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="481">• Affirmative: I play / She plays.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="511">• Negative: I don't play / She doesn't play.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="541">• Question: Do you play? Does she play?</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="571">• 3rd person: -s, -es or -ies.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="601">• Clues: always, often, usually, every day.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="631">• Stative verbs (know, like, want...) usually</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="661">• do not appear in continuous forms.</text><line stroke="#ed455d" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="697" y2="697" /><rect fill="#fff0f3" height="411" rx="25" stroke="#ed455d" stroke-width="2.5" width="550" x="617" y="306" /><rect fill="#ed455d" height="80" rx="24" width="550" x="617" y="306" /><rect fill="#ed455d" height="30" width="550" x="617" y="356" /><circle cx="660" cy="346" fill="#ffc948" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="355">02</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="355">PRESENT CONTINUOUS</text><text fill="#ed455d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="423">Now · temporary situations</text><g fill="none" opacity="0.13" stroke="#ed455d" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,436) scale(0.85)"><circle cx="60" cy="40" r="38" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="60" x2="60" y1="40" y2="15" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="60" x2="81" y1="40" y2="52" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="481">• am / is / are + verb-ing.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="511">• I am studying. She isn't listening.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="541">• Are they working? Yes, they are.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="571">• Spelling: make → making; run → running;</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="601">• lie → lying. Clues: now, at the moment.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="631">• Compare: I study every day /</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="661">• I am studying right now.</text><line stroke="#ed455d" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="697" y2="697" /><rect fill="#fff0f3" height="411" rx="25" stroke="#ed455d" stroke-width="2.5" width="550" x="35" y="743" /><rect fill="#ed455d" height="80" rx="24" width="550" x="35" y="743" /><rect fill="#ed455d" height="30" width="550" x="35" y="793" /><circle cx="78" cy="783" fill="#ffc948" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="792">03</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="792">PAST SIMPLE &amp; CONTINUOUS</text><text fill="#ed455d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="860">Finished vs. ongoing in the past</text><g fill="none" opacity="0.13" stroke="#ed455d" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,873) scale(0.85)"><circle cx="60" cy="40" r="38" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="60" x2="60" y1="40" y2="15" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="60" x2="81" y1="40" y2="52" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="108" x2="108" y1="12" y2="70" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="918">• Past simple: I visited / She went.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="948">• Negatives: didn't + base verb.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="978">• Past continuous: was/were + -ing.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1008">• I was reading when the phone rang.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1038">• While + ongoing action; when + interruption.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1068">• Used to + base verb: past habits or states.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1098">• I used to walk to school.</text><line stroke="#ed455d" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1134" y2="1134" /><rect fill="#fff0f3" height="411" rx="25" stroke="#ed455d" stroke-width="2.5" width="550" x="617" y="743" /><rect fill="#ed455d" height="80" rx="24" width="550" x="617" y="743" /><rect fill="#ed455d" height="30" width="550" x="617" y="793" /><circle cx="660" cy="783" fill="#ffc948" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="792">04</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="792">PRESENT PERFECT</text><text fill="#ed455d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="860">Experiences · present results</text><g fill="none" opacity="0.13" stroke="#ed455d" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,873) scale(0.85)"><rect fill="#ed455d" height="65" opacity="0.12" rx="14" width="116" x="4" y="5" /><polyline points="30,70 28,87 50,70" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="23" y2="23" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="38" y2="38" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="53" y2="53" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="918">• have/has + past participle.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="948">• I have finished. She has never tried it.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="978">• already, yet, ever, never, just, for, since.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1008">• Past simple: finished time (yesterday).</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1038">• Present perfect: links past and present.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1068">• I saw it yesterday / I've seen it before.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1098">• Irregular verbs: learn all 3 columns.</text><line stroke="#ed455d" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1134" y2="1134" /><rect fill="#fff0f3" height="411" rx="25" stroke="#ed455d" stroke-width="2.5" width="550" x="35" y="1180" /><rect fill="#ed455d" height="80" rx="24" width="550" x="35" y="1180" /><rect fill="#ed455d" height="30" width="550" x="35" y="1230" /><circle cx="78" cy="1220" fill="#ffc948" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="58" y="1229">05</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="117" y="1229">MODALS &amp; FUTURE</text><text fill="#ed455d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="57" y="1297">Advice · rules · plans</text><g fill="none" opacity="0.13" stroke="#ed455d" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(432,1310) scale(0.85)"><circle cx="60" cy="40" r="38" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="60" x2="60" y1="40" y2="15" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="60" x2="81" y1="40" y2="52" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1355">• Can / can't: ability and permission.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1385">• Must / have to: obligation.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1415">• Mustn't: prohibition; don't have to: no need.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1445">• Should / shouldn't: advice.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1475">• Will: predictions or spontaneous decisions.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1505">• Be going to: intentions or evidence.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="60" y="1535">• Present continuous: arranged future plans.</text><line stroke="#ed455d" stroke-linecap="round" stroke-width="1.5" x1="57" x2="561" y1="1571" y2="1571" /><rect fill="#fff0f3" height="411" rx="25" stroke="#ed455d" stroke-width="2.5" width="550" x="617" y="1180" /><rect fill="#ed455d" height="80" rx="24" width="550" x="617" y="1180" /><rect fill="#ed455d" height="30" width="550" x="617" y="1230" /><circle cx="660" cy="1220" fill="#ffc948" r="28" /><text fill="#19334d" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" x="640" y="1229">06</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="bold" x="699" y="1229">WORDS &amp; STUDY</text><text fill="#ed455d" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="bold" x="639" y="1297">Workbook · Students Book</text><g fill="none" opacity="0.13" stroke="#ed455d" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" transform="translate(1014,1310) scale(0.85)"><rect fill="#ed455d" height="65" opacity="0.12" rx="14" width="116" x="4" y="5" /><polyline points="30,70 28,87 50,70" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="23" y2="23" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="38" y2="38" /><line stroke="#ed455d" stroke-linecap="round" stroke-width="3" x1="25" x2="99" y1="53" y2="53" /></g><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1355">• Health and wellbeing: habits and symptoms.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1385">• Personal qualities: describing people.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1415">• Extreme adjectives: very strong meanings.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1445">• Learning techniques: review and practice.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1475">• 80 irregular verbs: infinitive / past /</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1505">• past participle / Spanish meaning.</text><text fill="#1b314b" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" x="642" y="1535">• Practise by covering 1, 2 or 3 forms.</text><line stroke="#ed455d" stroke-linecap="round" stroke-width="1.5" x1="639" x2="1143" y1="1571" y2="1571" /><rect fill="#ed455d" height="42" rx="18" width="1130" x="35" y="1627" /><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="bold" x="56" y="1655">REPASA · PRACTICA · EXPLICA CON TUS PALABRAS</text><text fill="#ffffff" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" x="1030" y="1655">TEMA 1</text></svg>